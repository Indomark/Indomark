<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="cache-control" content="no-store">
<meta name="theme-color" content="#050914">
<script>(function(){const t=localStorage.getItem('indomark_settings_theme')||'dark';const v=t==='light'?'light':t==='system'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):'dark';document.documentElement.dataset.theme=v;document.documentElement.style.colorScheme=v;})();</script>
<script src="../js/settings.js?v=10"></script>
<link rel="stylesheet" href="../css/app-theme.css?v=26">
<link rel="stylesheet" href="../css/global-theme.css?v=17">
<link rel="stylesheet" href="../css/indomark-page-brand.css?v=8">
<title>Indomark — Choose Language</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,Helvetica,sans-serif}
.page{min-height:100dvh;padding:20px 18px 90px;background:var(--bg);color:var(--text)}
.wrap{width:min(780px,100%);margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;color:var(--text)!important;text-decoration:none;font-size:30px!important;line-height:1!important;font-weight:900!important;letter-spacing:-1.7px!important;white-space:nowrap}
.brand .bolt{width:30px!important;height:30px!important;flex:0 0 30px!important;display:inline-block;background:transparent url('../assets/indomark-compass-dark.svg?v=1') center/contain no-repeat!important}
.brand span:not(.bolt){color:var(--text)!important}
.brand strong{font-weight:900}
.back{width:40px;height:40px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--text);display:grid;place-items:center;text-decoration:none}
.hero{margin:24px 0 18px}
.eyebrow{margin:0;color:var(--green);font-size:10px;font-weight:900;letter-spacing:1px}
.hero h1{margin:7px 0 0;font-size:32px;line-height:1.12;letter-spacing:-.7px}
.hero p{margin:9px 0 0;color:var(--muted);font-size:14px;line-height:1.5}
.context{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--muted);font-size:13px;line-height:1.4;margin:12px 0 14px}
.context b{color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.lang{padding:17px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);cursor:pointer;text-align:left;box-shadow:var(--shadow);min-height:72px}
.lang:hover,.lang:focus{border-color:#7047e8;outline:none}
.lang b{display:block;font-size:14px;line-height:1.3}
.lang small{display:block;margin-top:5px;color:var(--muted);font-size:11px;line-height:1.35}
@media(min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){
  .page{padding:16px 12px calc(100px + env(safe-area-inset-bottom))}
  .brand{font-size:36px!important;gap:8px!important}
  .brand .bolt{width:28px!important;height:28px!important;flex-basis:28px!important}
  .hero{margin-top:22px}
  .hero h1{font-size:28px}
  .hero p{font-size:13px}
  .context{font-size:12px}
  .lang{padding:15px;min-height:68px}
  .lang b{font-size:14px}
  .lang small{font-size:10px}
}
@media(max-width:380px){
  .page{padding-left:8px;padding-right:8px}
  .brand{font-size:36px!important;gap:7px!important}
  .brand .bolt{width:26px!important;height:26px!important;flex-basis:26px!important}
  .hero h1{font-size:26px}
  .context{font-size:11px;padding:11px 12px}
  .grid{gap:8px}
  .lang{padding:14px}
  .lang b{font-size:13px}
  .lang small{font-size:10px}
}
</style>
</head>
<body>
<main class="page">
  <div class="wrap">
    <header class="top">
      <a class="brand" href="learn.html" aria-label="Indomark Home"><span class="bolt" aria-hidden="true"></span><span>Indo<strong>mark</strong></span></a>
      <a class="back" id="back" href="learn.html" aria-label="Back">←</a>
    </header>
    <section class="hero">
      <p class="eyebrow">STEP 2 OF 4</p>
      <h1>Choose your learning language</h1>
      <p>Choose the language. Next you will choose the YouTube teacher/channel.</p>
      <div class="context">Category: <b id="categoryName">—</b></div>
    </section>
    <section class="grid" id="languages"></section>
  </div>
</main>
<script>
const LANGUAGE_KEY='indomark_learn_language_v2',CATEGORY_KEY='indomark_learn_category_v1';
const p=new URLSearchParams(location.search);
const rawCategory=p.get('category')||localStorage.getItem(CATEGORY_KEY)||'Stock Market Basics';
const categoryMap={basics:'Stock Market Basics',technical:'Technical Analysis',fundamental:'Fundamental Analysis',risk:'Risk Management',psychology:'Investor Psychology',education:'Investor Education'};
const category=categoryMap[String(rawCategory).trim().toLowerCase()]||rawCategory;
localStorage.setItem(CATEGORY_KEY,category);
document.getElementById('categoryName').textContent=category;
const langs=[['en','English','English'],['kn','ಕನ್ನಡ','Kannada'],['hi','हिन्दी','Hindi'],['ta','தமிழ்','Tamil'],['mr','मराठी','Marathi'],['te','తెలుగు','Telugu'],['ml','മലയാളം','Malayalam'],['gu','ગુજરાતી','Gujarati'],['bn','বাংলা','Bengali'],['or','ଓଡ଼ିଆ','Odia']];
const box=document.getElementById('languages');
box.innerHTML=langs.map(([code,label,sub])=>`<button class="lang" data-lang="${code}"><b>${label}</b><small>${sub}</small></button>`).join('');
box.querySelectorAll('.lang').forEach(b=>b.onclick=()=>{const lang=b.dataset.lang;localStorage.setItem(LANGUAGE_KEY,lang);const u=new URL('learn-channel-v2.html',location.href);u.searchParams.set('lang',lang);u.searchParams.set('category',category);location.href=u.toString();});
</script>
</body>
</html>
