<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="cache-control" content="no-store"><meta name="theme-color" content="#050914"><script>(function(){const t=localStorage.getItem('indomark_settings_theme')||'dark';const v=t==='light'?'light':t==='system'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):'dark';document.documentElement.dataset.theme=v;document.documentElement.style.colorScheme=v;})();</script><script src="../js/settings.js?v=10"></script><link rel="stylesheet" href="../css/app-theme.css?v=12"><link rel="stylesheet" href="../css/global-theme.css?v=7"><title>Indomark — Choose Language</title><style>body{margin:0}.page{min-height:100dvh;padding:18px 14px 90px;background:var(--bg);color:var(--text)}.wrap{width:min(780px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:28px;letter-spacing:-.7px}.brand span{color:var(--green)}.back{width:40px;height:40px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--text);display:grid;place-items:center;text-decoration:none}.hero{margin:22px 0 16px}.eyebrow{margin:0;color:var(--green);font-size:9px;font-weight:900;letter-spacing:1px}.hero h1{margin:6px 0 0;font-size:28px}.hero p{margin:7px 0 0;color:var(--muted);font-size:12px}.context{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--muted);font-size:10px;margin:10px 0 12px}.context b{color:var(--text)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.lang{padding:15px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);cursor:pointer;text-align:left;box-shadow:var(--shadow)}.lang:hover,.lang:focus{border-color:#7047e8;outline:none}.lang b{display:block;font-size:13px}.lang small{display:block;margin-top:4px;color:var(--muted);font-size:10px}@media(min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:380px){.page{padding-left:8px;padding-right:8px}.brand{font-size:24px}.hero h1{font-size:25px}.grid{gap:7px}.lang{padding:12px}.lang b{font-size:12px}.lang small{font-size:9px}}</style></head><body><main class="page"><div class="wrap"><header class="top"><div class="brand">Indo<span>mark</span></div><a class="back" id="back" href="learn.html" aria-label="Back">←</a></header><section class="hero"><p class="eyebrow">STEP 2 OF 4</p><h1>Choose your learning language</h1><p>Choose the language. Next you will choose the YouTube teacher/channel.</p><div class="context">Category: <b id="categoryName">—</b></div></section><section class="grid" id="languages"></section></div></main><script>const LANGUAGE_KEY='indomark_learn_language_v2',CATEGORY_KEY='indomark_learn_category_v1';const p=new URLSearchParams(location.search);const rawCategory=p.get('category')||localStorage.getItem(CATEGORY_KEY)||'Stock Market Basics';const categoryMap={basics:'Stock Market Basics',technical:'Technical Analysis',fundamental:'Fundamental Analysis',risk:'Risk Management',psychology:'Investor Psychology',education:'Investor Education'};const category=categoryMap[String(rawCategory).trim().toLowerCase()]||rawCategory;localStorage.setItem(CATEGORY_KEY,category);document.getElementById('categoryName').textContent=category;const langs=[['en','English','English'],['kn','ಕನ್ನಡ','Kannada'],['hi','हिन्दी','Hindi'],['ta','தமிழ்','Tamil'],['mr','मराठी','Marathi'],['te','తెలుగు','Telugu'],['ml','മലയാളം','Malayalam'],['gu','ગુજરાતી','Gujarati'],['bn','বাংলা','Bengali'],['or','ଓଡ଼ିଆ','Odia']];const box=document.getElementById('languages');box.innerHTML=langs.map(([code,label,sub])=>`<button class="lang" data-lang="${code}"><b>${label}</b><small>${sub}</small></button>`).join('');box.querySelectorAll('.lang').forEach(b=>b.onclick=()=>{const lang=b.dataset.lang;localStorage.setItem(LANGUAGE_KEY,lang);const u=new URL('learn-channel-v2.html',location.href);u.searchParams.set('lang',lang);u.searchParams.set('category',category);location.href=u.toString();});</script></body></html>
