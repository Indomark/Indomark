<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="theme-color" content="#050914">
  <meta name="description" content="IndoSpeed account creation">
  <title>IndoSpeed — Create Account</title>
  <link rel="stylesheet" href="../css/signup.css?v=5">
</head>
<body class="entry-signup">
  <main class="signup-page">
    <section class="signup-shell" aria-label="Create IndoSpeed account">
      <header class="signup-header">
        <div class="signup-brand" aria-label="IndoSpeed">
          <span class="brand-bolt" aria-hidden="true"></span>
          <span class="brand-wordmark"><span class="brand-indo">Indo</span><span class="brand-speed">Speed</span></span>
        </div>
        <h1>Create Account</h1>
        <p class="subtitle">Start your journey to become a smart investor</p>
      </header>
      <form id="signupForm" class="signup-form" novalidate>
        <label for="fullName">Full Name<input id="fullName" name="fullName" type="text" autocomplete="name" placeholder="Rahul Kumar" required></label>
        <label for="email">Email<input id="email" name="email" type="email" autocomplete="email" placeholder="rahul@gmail.com" required></label>
        <label for="password">Password<span class="password-wrap"><input id="password" name="password" type="password" autocomplete="new-password" placeholder="••••••••" minlength="8" required><button type="button" id="togglePassword" class="icon-button" aria-label="Show password" aria-pressed="false">◉</button></span></label>
        <button class="primary-button" type="submit">Sign Up</button>
      </form>
      <p class="login-copy">Already have an account? <a href="./login.html" id="loginLink">Login</a></p>
      <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="../js/signup.js?v=3"></script>
</body>
</html>
