lStorage.getItem("indospeed_settings_theme")==="light"?"light":"dark";</script><script src="../js/settings.js?v=6"></script><link rel="stylesheet" href="../css/app-theme.css?v=8"><link rel="stylesheet" href="../css/global-theme.css?v=3"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050914"><title>IndoSpeed — Notifications</title><link rel="stylesheet" href="../css/secondary.css?v=5"><style>.notifications-page{min-height:100dvh;padding:18px 12px 110px}.notifications-wrap{width:min(900px,100%);margin:auto}.notification-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.notification-head h1{margin:0;font-size:28px}.notification-head p{margin:6px 0 0;color:var(--muted);font-size:12px}.back-btn{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);color:#fff;text-decoration:none}.clear-btn{border:1px solid var(--line);background:var(--panel-2);color:#fff;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}.notification-list{display:grid;gap:10px}.notification-card{padding:14px}.notification-card h2{margin:0 0 5px;font-size:15px}.notification-card p{margin:0;color:#bcc8d8;font-size:12px;line-height:1.5}.notification-card small{display:block;margin-top:8px;color:var(--muted);font-size:10px}.empty-state{text-align:center;padding:42px 16px;color:var(--muted)}.empty-state strong{display:block;color:#fff;font-size:15px;margin-bottom:6px}.bottom-nav{position:fixed;z-index:30;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(920px,calc(100% - 22px));display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:7px;border:1px solid var(--line);border-radius:18px;background:rgba(7,14,25,.96);backdrop-filter:blur(18px)}.bottom-nav a{color:#8190a4;text-decoration:none;text-align:center;padding:10px 5px;border-radius:11px;font-size:11px;font-weight:800}.bottom-nav a.active{background:#191f38;color:#fff}.bottom-nav .icon{display:block;font-size:15px;line-height:1;margin-bottom:4px}@media(max-width:640px){.notifications-page{padding-left:8px;padding-right:8px}.notification-head h1{font-size:24px}.bottom-nav{width:calc(100% - 16px);padding:6px;gap:2px}.bottom-nav a{padding:9px 3px;font-size:10px}.bottom-nav .icon{font-size:14px}}</style></head><body><main class="notifications-page"><div class="notifications-wrap"><header class="notification-head"><div><h1>Notifications</h1><p>Market updates and app activity</p></div><div style="display:flex;gap:8px"><a class="back-btn" href="home.html" aria-label="Home">⌂</a><button id="clearBtn" class="clear-btn" type="button">Clear</button></div></header><section id="notificationList" class="notification-list"></section></div><nav class="bottom-nav" aria-label="Main navigation"><a href="home.html"><span class="icon">⌂</span>Home</a><a href="watchlist.html"><span class="icon">☆</span>Watchlist</a><a href="portfolio.html"><span class="icon">▣</span>Portfolio</a><a href="learn.html"><span class="icon">◫</span>Learn</a><a href="profile.html"><span class="icon">◉</span>Profile</a></nav></main><script>const defaults=[{title:'Welcome to IndoSpeed',text:'Your market alerts, app updates and reminders will appear here.',time:'Just now'},{title:'Market updates',text:'Use the Alerts page to create stock-price notifications.',time:'Today'}];const key='indospeed_notifications';function getItems(){try{return JSON.parse(localStorage.getItem(key)||'null')||defaults}catch{return defaults}}function render(){const list=document.getElementById('notificationList');const items=getItems();if(!items.length){list.innerHTML='<div class="empty-state glass"><strong>No notifications</strong><span>You are all caught up.</span></div>';return}list.innerHTML=items.map(x=>`<article class="notification-card glass"><h2>${escapeHtml(x.title||'Notification')}</h2><p>${escapeHtml(x.text||'')}</p><small>${escapeHtml(x.time||'')}</small></article>`).join('')}function escapeHtml(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}document.getElementById('clearBtn').addEventListener('click',()=>{localStorage.setItem(key,'[]');render()});render();</script></body></html>
