<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050914">
<script>(function(){const t=localStorage.getItem("indomark_settings_theme")||"dark";const r=t==='system'&&(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':t==='light'?'light':'dark';document.documentElement.dataset.theme=r;document.documentElement.style.colorScheme=r;})();</script>
<script src="../js/settings.js?v=24"></script>
<link rel="manifest" href="../manifest.json?v=20260829-6">
<link rel="icon" type="image/svg+xml" href="../assets/indomark-mobile-icon.svg?v=6">
<link rel="shortcut icon" type="image/svg+xml" href="../assets/indomark-mobile-icon.svg?v=6">
<link rel="apple-touch-icon" href="../assets/indomark-mobile-icon.svg?v=6">
<link rel="stylesheet" href="../css/app-theme.css?v=26">
<link rel="stylesheet" href="../css/global-theme.css?v=17">
<link rel="stylesheet" href="../css/secondary.css?v=8">
<link rel="stylesheet" href="../css/indomark-page-brand.css?v=8">
<link rel="stylesheet" href="../css/notifications.css?v=7">
<style>
@media (max-width:700px){
  .notifications-page{padding:16px 12px calc(110px + env(safe-area-inset-bottom))!important;overflow-x:hidden!important}
  .notifications-wrap{width:100%!important;max-width:none!important;margin:0!important}
  .notification-head{display:flex!important;flex-direction:column!important;align-items:stretch!important;gap:14px!important;padding:2px 0 16px!important;border-bottom:1px solid var(--line)!important}
  .notification-heading-group{width:100%!important;min-width:0!important}
  .notification-heading-group>.brand{display:flex!important;align-items:center!important;gap:8px!important;width:max-content!important;max-width:100%!important;font-size:30px!important;line-height:1!important;letter-spacing:-1px!important;white-space:nowrap!important}
  .notification-heading-group>.brand .bolt{width:28px!important;height:28px!important;flex:0 0 28px!important;background-image:url('../assets/indomark-compass-dark.svg?v=1')!important}
  html[data-theme="light"] .notification-heading-group>.brand .bolt{background-image:url('../assets/indomark-compass-light.svg?v=1')!important}
  .notification-title-row{display:flex!important;align-items:center!important;justify-content:center!important;width:100%!important;margin-top:10px!important;text-align:center!important}
  .notification-head h1{font-size:23px!important;line-height:1.1!important;letter-spacing:-.4px!important}
  .notification-filters{display:flex!important;gap:8px!important;align-items:center!important;overflow-x:auto!important;padding:13px 0 7px!important;margin:0!important}
  .filter-chip{flex:0 0 auto!important;padding:8px 11px!important;font-size:9px!important}
  .notification-list{display:grid!important;gap:8px!important;margin-top:5px!important}
  .notification-card{display:grid!important;grid-template-columns:38px minmax(0,1fr)!important;gap:10px!important;padding:12px!important;min-width:0!important}
  .notification-icon{width:38px!important;height:38px!important;border-radius:11px!important}
  .notification-icon svg{width:19px!important;height:19px!important}
  .notification-body{min-width:0!important;padding-top:1px!important}
  .notification-body h2{font-size:11px!important;line-height:1.3!important;margin:0 0 4px!important}
  .notification-body p{font-size:9px!important;line-height:1.45!important}
  .notification-meta{grid-column:2!important;display:flex!important;align-items:center!important;justify-content:space-between!important;gap:8px!important;min-width:0!important;margin-top:2px!important;padding:0 1px 0 0!important}
  .notification-time{font-size:8px!important}
  .notification-status{margin:0!important;padding:4px 7px!important;font-size:7px!important;line-height:1!important}
  .notification-card.unread:after{right:11px!important;top:11px!important;width:6px!important;height:6px!important}
  .notifications-page .bottom-nav{width:calc(100vw - 24px)!important;max-width:none!important;bottom:max(8px,env(safe-area-inset-bottom))!important}
}
@media (max-width:380px){
  .notification-heading-group>.brand{font-size:28px!important}
  .notification-heading-group>.brand .bolt{width:26px!important;height:26px!important;flex-basis:26px!important}
  .notification-title-row{justify-content:center!important}
  .notification-head h1{font-size:22px!important}
  .notification-card{grid-template-columns:36px minmax(0,1fr)!important;gap:9px!important;padding:11px!important}
  .notification-icon{width:36px!important;height:36px!important}
  .notification-icon svg{width:18px!important;height:18px!important}
}
</style>
<title>Indomark — Notifications</title>
</head>
<body>
<main class="notifications-page">
  <div class="notifications-wrap">
    <header class="notification-head">
      <div class="notification-heading-group">
        <a class="brand" href="home.html" aria-label="Indomark Home"><span class="bolt" aria-hidden="true"></span><span>Indo<strong>mark</strong></span></a>
        <div class="notification-title-row">
          <div><h1>Notifications</h1></div>
        </div>
      </div>
    </header>

    <nav class="notification-filters" aria-label="Notification filters">
      <button class="filter-chip active" type="button" data-filter="all">All</button>
      <button class="filter-chip" type="button" data-filter="alerts">Alerts</button>
      <button class="filter-chip" type="button" data-filter="updates">Updates</button>
      <button class="filter-chip" type="button" data-filter="system">System</button>
    </nav>

    <section id="notificationList" class="notification-list" aria-live="polite"></section>
  </div>

  <nav class="bottom-nav" aria-label="Main navigation">
    <a href="home.html"><span class="icon">⌂</span>Home</a>
    <a href="watchlist.html"><span class="icon">☆</span>Watchlist</a>
    <a href="portfolio.html"><span class="icon">▣</span>Portfolio</a>
    <a href="learn.html"><span class="icon">◫</span>Learn</a>
    <a href="profile.html"><span class="icon">◉</span>Profile</a>
  </nav>
</main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="../js/firebase-config.js?v=27"></script>
<script src="../js/notification-live.js?v=1"></script>
<script src="../js/notifications.js?v=3"></script>
</body>
</html>
