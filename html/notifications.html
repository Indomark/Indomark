<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050914"><script>document.documentElement.dataset.theme=localStorage.getItem("indomark_settings_theme")==="light"?"light":"dark";</script><script src="../js/settings.js?v=14"></script><link rel="icon" type="image/svg+xml" href="../assets/indomark-favicon.svg?v=8"><link rel="stylesheet" href="../css/app-theme.css?v=19"><link rel="stylesheet" href="../css/global-theme.css?v=11"><link rel="stylesheet" href="../css/secondary.css?v=5"><title>Indomark — Notifications</title></head><body><main class="notifications-page"><div class="notifications-wrap"><header class="notification-head"><div><h1>Notifications</h1><p>Market updates and app activity</p></div><div style="display:flex;gap:8px"><a class="back-btn" href="home.html" aria-label="Home">⌂</a><button id="clearBtn" class="clear-btn" type="button">Clear</button></div></header><section id="notificationList" class="notification-list"></section></div><nav class="bottom-nav" aria-label="Main navigation"><a href="home.html"><span class="icon">⌂</span>Home</a><a href="watchlist.html"><span class="icon">☆</span>Watchlist</a><a href="portfolio.html"><span class="icon">▣</span>Portfolio</a><a href="learn.html"><span class="icon">◫</span>Learn</a><a href="profile.html"><span class="icon">◉</span>Profile</a></nav></main><script>const defaults=[{title:'Welcome to Indomark',text:'Your market alerts, app updates and reminders will appear here.',time:'Just now'},{title:'Market updates',text:'Use the Alerts page to create stock-price notifications.',time:'Today'}];const key='indomark_notifications';function getItems(){try{return JSON.parse(localStorage.getItem(key)||'null')||defaults}catch{return defaults}}function render(){const list=document.getElementById('notificationList');const items=getItems();if(!items.length){list.innerHTML='<div class="empty-state glass"><strong>No notifications</strong><span>You are all caught up.</span></div>';return}list.innerHTML=items.map(x=>`<article class="notification-card glass"><h2>${escapeHtml(x.title||'Notification')}</h2><p>${escapeHtml(x.text||'')}</p><small>${escapeHtml(x.time||'')}</small></article>`).join('')}function escapeHtml(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}document.getElementById('clearBtn').addEventListener('click',()=>{localStorage.setItem(key,'[]');render()});render();</script></body></html>
