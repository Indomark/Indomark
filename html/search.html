<!doctype html>
<html lang="en">
<head>
<script>(function(){const p=localStorage.getItem('indomark_settings_theme')||'dark';const r=p==='system'?(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):p;document.documentElement.dataset.theme=r;document.documentElement.style.colorScheme=r;})();</script>
<script src="../js/settings.js?v=15"></script>
<link rel="icon" type="image/svg+xml" href="../assets/indomark-favicon.svg?v=10">
<link rel="stylesheet" href="../css/app-theme.css?v=20">
<link rel="stylesheet" href="../css/global-theme.css?v=12">
<link rel="stylesheet" href="../css/entry-dark.css?v=4">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Indomark — Search Stocks</title>
<link rel="stylesheet" href="../css/search.css?v=3">
</head>
<body>
<main class="search-page">
<header class="search-topbar">
<button class="back-btn" type="button" aria-label="Back" onclick="history.back()">←</button>
<div class="brand"><span class="bolt" aria-hidden="true"></span><strong>Indo<span>mark</span></strong></div>
<button class="clear-btn" type="button" aria-label="Clear search">×</button>
</header>
<section class="search-hero">
<p class="eyebrow">EXPLORE THE MARKET</p>
<h1>Search Stocks</h1>
<p>Search stocks that are available in Indomark.</p>
</section>
<section class="search-box-wrap">
<label class="search-box" for="stockSearch">
<span class="search-icon">⌕</span>
<input id="stockSearch" type="search" autocomplete="off" placeholder="Search stock or symbol...">
<kbd>⌘ K</kbd>
</label>
</section>
<div class="tabs" role="tablist" aria-label="Search filters">
<button class="tab active" data-filter="all">All</button>
<button class="tab" data-filter="stocks">Stocks</button>
<button class="tab" data-filter="indices">Indices</button>
</div>
<section class="results-section">
<div class="section-head"><h2>Available Stocks</h2><span id="resultCount">Loading...</span></div>
<div id="results" class="results-list"></div>
<div id="empty" class="empty-state" hidden>
<div class="empty-icon">⌕</div>
<h3>No matching stocks</h3>
<p>Try a stock name or symbol that is available in Indomark.</p>
</div>
</section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="../js/firebase-config.js?v=28"></script>
<script src="../js/stock-catalog.js?v=1"></script>
<script src="../js/search.js?v=3"></script>
</body>
</html>
