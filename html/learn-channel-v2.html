<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050914"><script>(function(){const t=localStorage.getItem('indomark_settings_theme')||'dark';document.documentElement.dataset.theme=t==='light'?'light':t==='system'?(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):'dark';})();</script><script src="../js/settings.js?v=11"></script><script src="../js/vistara-kannada-video-catalog.js?v=6"></script><script src="../js/angel-investments-kannada-video-catalog.js?v=4"></script><script src="../js/learn-course-catalog.js?v=8"></script><link rel="stylesheet" href="../css/app-theme.css?v=13"><link rel="stylesheet" href="../css/global-theme.css?v=8"><title>Indomark — Choose Channel</title><style>body{margin:0}.page{min-height:100dvh;padding:18px 14px 90px;background:var(--bg);color:var(--text)}.wrap{width:min(780px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px;color:var(--text)!important;text-decoration:none;font-size:30px!important;line-height:1!important;font-weight:900!important;letter-spacing:-1.7px!important;white-space:nowrap}.brand .bolt{width:30px!important;height:30px!important;flex:0 0 30px!important;display:inline-block;background:transparent url('../assets/indomark-compass-dark.svg?v=1') center/contain no-repeat!important}.brand span:not(.bolt){color:var(--text)!important}.brand strong{font-weight:900}.back{width:40px;height:40px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--text);display:grid;place-items:center;text-decoration:none}.hero{margin:22px 0 16px}.eyebrow{margin:0;color:#7047e8;font-size:9px;font-weight:900;letter-spacing:.8px}.hero h1{margin:6px 0 0;font-size:28px}.hero p{margin:7px 0 0;color:var(--muted);font-size:12px}.context{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--muted);font-size:10px;margin-bottom:12px}.context b{color:var(--text)}.grid{display:grid;gap:10px}.teacher{padding:15px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);cursor:pointer;text-align:left;box-shadow:var(--shadow)}.teacher:hover,.teacher:focus{border-color:#7047e8;outline:none}.teacher b{display:block;font-size:13px}.teacher small{display:block;margin-top:4px;color:var(--muted);font-size:10px}.teacher .meta{margin-top:8px;color:#7047e8;font-size:9px;font-weight:900}.empty{padding:14px;border:1px dashed var(--line);border-radius:13px;color:var(--muted);font-size:11px}@media(min-width:720px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.brand{font-size:36px!important;gap:8px!important}.brand .bolt{width:28px!important;height:28px!important;flex-basis:28px!important}}@media(max-width:380px){.brand{font-size:36px!important;gap:7px!important}.brand .bolt{width:26px!important;height:26px!important;flex-basis:26px!important}}@media(max-width:420px){.page{padding-left:10px;padding-right:10px}.hero h1{font-size:26px}.teacher{padding:13px}}</style></head><body><main class="page channel-page"><div class="wrap"><header class="top"><a class="brand" href="learn.html" aria-label="Indomark Home"><span class="bolt" aria-hidden="true"></span><span>Indo<strong>mark</strong></span></a><a class="back" id="back" href="learn-language-v2.html" aria-label="Back">←</a></header><section class="hero"><p class="eyebrow">STEP 3 OF 4</p><h1>Choose your teacher/channel</h1><p>Select a verified learning channel. Next you will see only its verified videos for this category.</p></section><div class="context">Category: <b id="categoryName">—</b></div><section class="grid" id="teachers"></section></div></main><script>(()=>{const p=new URLSearchParams(location.search);const lang=p.get('lang')||localStorage.getItem('indomark_learn_language_v2')||'en';const rawCategory=p.get('category')||localStorage.getItem('indomark_learn_category_v1')||'Stock Market Basics';const categoryMap={basics:'Stock Market Basics',technical:'Technical Analysis',fundamental:'Fundamental Analysis',risk:'Risk Management',psychology:'Investor Psychology',education:'Investor Education'};const category=categoryMap[String(rawCategory).trim().toLowerCase()]||rawCategory;localStorage.setItem('indomark_learn_language_v2',lang);localStorage.setItem('indomark_learn_category_v1',category);document.getElementById('categoryName').textContent=category;document.getElementById('back').href=`learn-language-v2.html?category=${encodeURIComponent(category)}`;const all={kn:[['vistara','Vistara Money Plus','ಕನ್ನಡ · verified stock-market education'],['angel','Angel Investments','ಕನ್ನಡ · verified stock-market education']]};const teachers=all[lang]||[];const hasVideos=id=>{if(lang!=='kn')return false;if(id==='vistara')return Array.isArray(window.INDOMARK_VISTARA_KANNADA_VIDEOS)&&window.INDOMARK_VISTARA_KANNADA_VIDEOS.some(v=>v&&v.verified!==false&&v.category===category&&v.videoId);if(id==='angel')return Array.isArray(window.INDOMARK_ANGEL_INVESTMENTS_KANNADA_VIDEOS)&&window.INDOMARK_ANGEL_INVESTMENTS_KANNADA_VIDEOS.some(v=>v&&v.verified!==false&&v.category===category&&v.videoId);return !!window.INDOMARK_LEARN_CATALOG?.getCatalog(lang,id,'varsity')?.parts?.some(x=>x&&x.videoId);};const list=teachers.filter(([id])=>hasVideos(id));const box=document.getElementById('teachers');if(!list.length){box.innerHTML='<div class="empty">ಈ ವಿಭಾಗಕ್ಕೆ verified Kannada channels ಇನ್ನೂ ಲಭ್ಯವಿಲ್ಲ.</div>';return;}box.innerHTML=list.map(([id,name,desc])=>`<button class="teacher" data-teacher="${id}"><b>${name}</b><small>${desc}</small><div class="meta">Open selected category → videos</div></button>`).join('');box.querySelectorAll('.teacher').forEach(b=>b.onclick=()=>{const teacher=b.dataset.teacher;localStorage.setItem(`indomark_teacher_${lang}`,teacher);const u=new URL('learn-videos.html',location.href);u.searchParams.set('lang',lang);u.searchParams.set('category',category);u.searchParams.set('teacher',teacher);u.searchParams.set('_v',Date.now());location.href=u.toString();});})();</script></body></html>
