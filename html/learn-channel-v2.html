<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="cache-control" content="no-store">
<meta name="theme-color" content="#050914">
<script>(function(){var t=localStorage.getItem('indomark_settings_theme')||'dark';var r=t==='system'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:light)').matches?'light':t==='light'?'light':'dark';document.documentElement.dataset.theme=r;document.documentElement.style.colorScheme=r;})();</script>
<script src="../js/settings.js?v=11"></script>
<script src="../js/vistara-kannada-video-catalog.js?v=20260830-3"></script>
<script src="../js/angel-investments-kannada-video-catalog.js?v=20260830-3"></script>
<link rel="stylesheet" href="../css/app-theme.css?v=20260830-3">
<link rel="stylesheet" href="../css/global-theme.css?v=20260830-3">
<title>Indomark — Choose Channel</title>
<style>
body{margin:0}.page{min-height:100dvh;padding:18px 14px 90px;background:var(--bg);color:var(--text)}.wrap{width:min(780px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:14px}.channel-brand,.channel-brand:visited{display:flex;align-items:center;gap:10px;color:var(--text)!important;text-decoration:none;font-size:30px;font-weight:900;line-height:1;letter-spacing:-1.7px;white-space:nowrap}.channel-brand .bolt{width:30px;height:30px;flex:0 0 30px;background:transparent url('../assets/indomark-compass-dark.svg?v=3') center/contain no-repeat}.back{width:40px;height:40px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--text);display:grid;place-items:center;text-decoration:none;font-size:18px}.hero{margin:22px 0 16px}.eyebrow{margin:0;color:#7047e8;font-size:9px;font-weight:900;letter-spacing:.8px}.hero h1{margin:6px 0 0;font-size:28px;color:var(--green)!important}.hero p{margin:7px 0 0;color:var(--muted);font-size:12px}.context{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--muted);font-size:10px;margin-bottom:12px}.context b{color:var(--text)}.grid{display:grid;gap:10px}.teacher{padding:15px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);cursor:pointer;text-align:left;box-shadow:var(--shadow);font:inherit}.teacher:hover,.teacher:focus{border-color:#7047e8;outline:none}.teacher b{display:block;font-size:13px}.teacher small{display:block;margin-top:4px;color:var(--muted);font-size:10px}.teacher .meta{margin-top:8px;color:#7047e8;font-size:9px;font-weight:900}.empty{padding:14px;border:1px dashed var(--line);border-radius:13px;color:var(--muted);font-size:11px}@media(min-width:720px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:640px){.page{padding-left:10px;padding-right:10px}.channel-brand,.channel-brand:visited{font-size:36px;gap:8px}.channel-brand .bolt{width:28px;height:28px;flex-basis:28px}.hero h1{font-size:28px}}@media(max-width:360px){.channel-brand,.channel-brand:visited{font-size:36px;gap:7px}.channel-brand .bolt{width:26px;height:26px;flex-basis:26px}.hero h1{font-size:26px}}
</style>
</head>
<body>
<main class="page channel-page"><div class="wrap">
<header class="top"><a class="channel-brand" href="learn.html" aria-label="Indomark Home"><span class="bolt" aria-hidden="true"></span><span>Indo<strong>mark</strong></span></a><a class="back" id="back" href="learn-language-v2.html" aria-label="Back">←</a></header>
<section class="hero"><p class="eyebrow">STEP 3 OF 4</p><h1>Choose your teacher/channel</h1><p>Select a verified learning channel. Next you will see only its verified videos for this category.</p></section>
<div class="context">Category: <b id="categoryName">—</b></div>
<section class="grid" id="teachers"></section>
</div></main>
<script>
(function(){'use strict';
var p=new URLSearchParams(location.search);var lang=p.get('lang')||localStorage.getItem('indomark_learn_language_v2')||'en';var rawCategory=p.get('category')||localStorage.getItem('indomark_learn_category_v1')||'Stock Market Basics';var categoryMap={basics:'Stock Market Basics',technical:'Technical Analysis',fundamental:'Fundamental Analysis',risk:'Risk Management',psychology:'Investor Psychology',education:'Investor Education'};var category=categoryMap[String(rawCategory).trim().toLowerCase()]||String(rawCategory).trim();
localStorage.setItem('indomark_learn_language_v2',lang);localStorage.setItem('indomark_learn_category_v1',category);document.getElementById('categoryName').textContent=category;document.getElementById('back').href='learn-language-v2.html?category='+encodeURIComponent(category);
var teachers=lang==='kn'?[['vistara','Vistara Money Plus','ಕನ್ನಡ · verified stock-market education'],['angel','Angel Investments','ಕನ್ನಡ · verified stock-market education']]:[];
var box=document.getElementById('teachers');
if(!teachers.length){box.innerHTML='<div class="empty">ಈ ಭಾಷೆಗೆ verified learning channels ಇನ್ನೂ ಲಭ್ಯವಿಲ್ಲ.</div>';return;}
box.innerHTML=teachers.map(function(x){return '<button type="button" class="teacher" data-teacher="'+x[0]+'"><b>'+x[1]+'</b><small>'+x[2]+'</small><div class="meta">Open selected category → videos</div></button>';}).join('');
box.querySelectorAll('.teacher').forEach(function(btn){btn.addEventListener('click',function(){var teacher=btn.getAttribute('data-teacher');localStorage.setItem('indomark_teacher_'+lang,teacher);var u=new URL('learn-videos.html',location.href);u.searchParams.set('lang',lang);u.searchParams.set('category',category);u.searchParams.set('teacher',teacher);u.searchParams.set('_v',Date.now());location.replace(u.toString());});});
})();
</script>
</body>
</html>
