<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<script src="../js/settings.js?v=11"></script>

<script src="../js/angel-investments-kannada-video-catalog.js?v=20260830-18"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0}body{font-family:Inter,Arial,sans-serif;background:var(--bg,#050914);color:var(--text,#fff)}a{color:inherit;text-decoration:none}.page{min-height:100dvh;padding:16px 12px 90px}.wrap{width:min(1000px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:30px;font-weight:900;letter-spacing:-1px}.back{width:40px;height:40px;border:1px solid var(--line,#273246);border-radius:11px;background:var(--panel,#0b1220);display:grid;place-items:center;font-size:18px}.hero{margin:18px 0 14px}.hero h1{margin:5px 0;color:var(--green,#58e7a5);font-size:25px}.hero p{margin:6px 0;color:var(--muted,#aeb9c8);font-size:11px}.context,.summary{display:flex;gap:8px;flex-wrap:wrap}.summary{margin-top:10px}.chip,.summary-item{padding:7px 9px;border:1px solid var(--line,#273246);border-radius:999px;background:var(--panel,#0b1220);font-size:9px}.summary-item{color:var(--muted,#aeb9c8)}.summary-item b{color:var(--text,#fff);margin-right:3px}.grid{display:grid;gap:12px}.level-block{display:grid;gap:8px}.level-head,.video-card{border:1px solid var(--line,#273246);border-radius:14px;background:var(--panel,#0b1220);overflow:hidden}.level-head{padding:12px}.level-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.kicker{color:var(--green,#58e7a5);font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:1px}.level-total{font-size:9px;color:var(--muted,#aeb9c8);white-space:nowrap}.level-head h2{margin:4px 0 0;font-size:16px}.level-head p{margin:5px 0 0;color:var(--muted,#aeb9c8);font-size:10px}.player{position:relative;aspect-ratio:16/9;background:#050914;overflow:hidden}.player iframe{width:100%;height:100%;border:0;display:block;pointer-events:auto}.body{padding:11px}.body>b{display:block;font-size:12px;line-height:1.35}.meta-line{margin-top:7px;padding:7px 9px;border:1px solid var(--line-soft,#1b2535);border-radius:8px;background:rgba(88,231,165,.05);color:var(--muted,#aeb9c8);font-size:10px;font-weight:800}.meta-line strong{color:var(--green,#58e7a5)}.what{margin-top:7px;padding-top:8px;border-top:1px solid var(--line-soft,#1b2535);font-size:10px;line-height:1.45}.what strong{color:var(--green,#58e7a5)}.body small{display:block;margin-top:6px;color:var(--muted,#aeb9c8);font-size:9px}.state{display:inline-block;margin-top:7px;padding:4px 6px;border-radius:999px;font-size:8px;font-weight:900}.active{background:rgba(88,231,165,.12);color:var(--green,#58e7a5)}.done{background:rgba(88,231,165,.16);color:var(--green,#58e7a5)}.empty{padding:20px;border:1px dashed var(--line,#273246);border-radius:13px;color:var(--muted,#aeb9c8);text-align:center;font-size:11px}@media(max-width:640px){.brand{font-size:36px}.summary-item{font-size:8px}.kicker{font-size:10px}.meta-line{font-size:10px}}
</style>
</head>
<body>
<main class="page"><div class="wrap">
<header class="top"><div class="brand">⚡ Indomark</div><a class="back" id="back" href="learn-channel-v2.html" aria-label="Back">←</a></header>
<section class="hero">
<h1>Videos</h1>
<p>Normal YouTube controls are enabled, including Ad Skip.</p>
<div class="context"><span class="chip" id="langChip">Language</span><span class="chip" id="teacherChip">Channel</span><span class="chip" id="catChip">Category</span></div>
<div class="summary"><span class="summary-item"><b id="totalCount">0</b>Total videos</span><span class="summary-item"><b id="levelCount">0</b>Levels</span><span class="summary-item"><b id="completedCount">0</b>Completed</span><span class="summary-item"><b id="remainingCount">0</b>Remaining</span></div>
</section>
<section class="grid" id="list"></section>
</div></main>
<script>
(function(){
'use strict';
var q=new URLSearchParams(location.search);
var lang=q.get('lang')||localStorage.getItem('indomark_learn_language_v2')||'kn';
var teacher=q.get('teacher')||localStorage.getItem('indomark_teacher_'+lang)||'vistara';
var raw=q.get('category')||localStorage.getItem('indomark_learn_category_v1')||'Stock Market Basics';
var map={basics:'Stock Market Basics',technical:'Technical Analysis',fundamental:'Fundamental Analysis',risk:'Risk Management',psychology:'Investor Psychology',education:'Investor Education'};
var category=map[String(raw).trim().toLowerCase()]||String(raw).trim()||'Stock Market Basics';
document.getElementById('langChip').textContent='Language: '+(lang==='kn'?'ಕನ್ನಡ':lang);
document.getElementById('teacherChip').textContent='Channel: '+(teacher==='vistara'?'Vistara Money Plus':teacher==='angel'?'Angel Investments':teacher);
document.getElementById('catChip').textContent='Category: '+category;
document.getElementById('back').href='learn-channel-v2.html?lang='+encodeURIComponent(lang)+'&category='+encodeURIComponent(category);
var fallback=[
{order:1,level:0,title:'ಏನಿದು Stock Market ? Stock Market ಹುಟ್ಟಿದ್ದು ಹೇಗೆ ? | History Of Stock Market',videoId:'g6kNBA-J7qI',description:'Stock market history ಮತ್ತು basic context.',source:'Vistara Money Plus'},
{order:2,level:0,title:'Stock Market Basics For beginners | ಷೇರು ಮಾರುಕಟ್ಟೆ ಹೂಡಿಕೆ ಬಗ್ಗೆ ಕಂಪ್ಲೀಟ್ ಮಾಹಿತಿ |',videoId:'UucJL1nqejw',description:'Investment, trading, Demat account, broker, Nifty ಮತ್ತು Sensex basics.',source:'Vistara Money Plus'},
{order:3,level:1,title:'Different Types Of Investment In Stock Market | ಹೂಡಿಕೆಯ ಪ್ರಮುಖ ವಿಧಗಳ ಸಮಗ್ರ ವಿವರ',videoId:'oBwtLi4tHfM',description:'Different investment types ಮತ್ತು approaches.',source:'Vistara Money Plus'},
{order:4,level:2,title:'ಷೇರನ್ನು ಖರೀದಿಸುವ ಮುಂಚೆ ಇದನ್ನು ತಪ್ಪದೆ ಮಾಡಿ.! | Stock Market Investment In Kannada | Share Market',videoId:'jJSIm32W49Y',description:'Share ಖರೀದಿಸುವ ಮೊದಲು ಮಾಡಬೇಕಾದ practical checks.',source:'Vistara Money Plus'},
{order:5,level:2,title:'What Is Trading And How To Trade For Beginners In Kannada | How To Earn More Money In Trading',videoId:'_KHXlzU1f-M',description:'Trading basics ಮತ್ತು beginner mechanics.',source:'Vistara Money Plus'}
];
function getVideos(){
var a=[];
try{
if(lang==='kn'&&teacher==='vistara'&&typeof window.getIndomarkVistaraVideos==='function')a=window.getIndomarkVistaraVideos(category);
else if(lang==='kn'&&teacher==='angel'&&typeof window.getIndomarkAngelInvestmentsVideos==='function')a=window.getIndomarkAngelInvestmentsVideos(category);
}catch(e){a=[];}
if(!Array.isArray(a)||!a.length){if(lang==='kn'&&teacher==='vistara'&&category==='Stock Market Basics')a=fallback.slice();}
var seen={};
return(Array.isArray(a)?a:[]).filter(function(v){if(!v||!v.videoId||v.verified===false||v.videoId==='LLGkm3TTcCg'||seen[v.videoId])return false;if(v.category&&v.category!==category)return false;seen[v.videoId]=1;return true;}).sort(function(a,b){return(Number(a.order)||999999)-(Number(b.order)||999999);});
}
var videos=getVideos(),list=document.getElementById('list');
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;');}
if(!videos.length){list.innerHTML='<div class="empty">ಈ channel/categoryಗೆ verified videos ಲಭ್ಯವಿಲ್ಲ.</div>';return;}
var progressKey='indomark_video_completed_v1|'+lang+'|'+teacher+'|'+category,completedState={};
try{var saved=JSON.parse(localStorage.getItem(progressKey)||'{}');if(saved&&typeof saved==='object')completedState=saved;}catch(e){}
function save(){try{localStorage.setItem(progressKey,JSON.stringify(completedState));}catch(e){}}
function yt(id){return'https://www.youtube.com/embed/'+encodeURIComponent(id)+'?rel=0&modestbranding=1&playsinline=1&controls=1&fs=1';}
function render(){
var groups={},levels=[];videos.forEach(function(v,i){var l=Number.isFinite(Number(v.level))?Number(v.level):9999;if(!groups[l]){groups[l]=[];levels.push(l);}groups[l].push({v:v,i:i});});
var doneTotal=videos.filter(function(v){return!!completedState[v.videoId];}).length;
document.getElementById('totalCount').textContent=videos.length;
document.getElementById('levelCount').textContent=levels.length;
document.getElementById('completedCount').textContent=doneTotal;
document.getElementById('remainingCount').textContent=videos.length-doneTotal;
var names={0:'Foundation',1:'Beginner Basics',2:'Core Concepts',3:'Technical Analysis',4:'Trading / Intraday',5:'F&O / Options / Futures',9999:'Verified Videos'},html='';
levels.sort(function(a,b){return a-b;});
levels.forEach(function(level){
var items=groups[level],levelDone=items.filter(function(x){return!!completedState[x.v.videoId];}).length;
html+='<section class="level-block"><div class="level-head"><div class="level-top"><div class="kicker">LEVEL '+esc(level)+'</div><div class="level-total">'+items.length+' videos · '+levelDone+' completed</div></div><h2>'+esc(names[level]||'Verified Videos')+'</h2><p>Video controls are enabled.</p></div>';
items.forEach(function(x){var v=x.v,i=x.i,done=!!completedState[v.videoId];html+='<article class="video-card"><div class="player"><iframe src="'+yt(v.videoId)+'" title="'+esc(v.title)+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen"></iframe></div><div class="body"><b>'+esc(v.title)+'</b><div class="meta-line"><strong>LEVEL '+esc(level)+'</strong> · VIDEO '+(i+1)+' OF '+videos.length+'</div>'+(v.description?'<div class="what"><strong>ಈ videoನಲ್ಲಿ ಏನು ಇದೆ?</strong><br>'+esc(v.description)+'</div>':'')+'<small>'+esc(v.source||teacher)+'</small><span class="state '+(done?'done':'active')+'">'+(done?'✓ Completed':'● Available')+'</span></div></article>';});
html+='</section>';});
list.innerHTML=html;
var iframes=list.querySelectorAll('iframe');
iframes.forEach(function(frame,idx){frame.addEventListener('load',function(){try{frame.contentWindow.postMessage(JSON.stringify({event:'command',func:'addEventListener',args:['onStateChange']}),'https://www.youtube.com');}catch(e){}});});
}
render();
})();
</script>
</body>
</html>
