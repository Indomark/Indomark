<script>(function(){'use strict';var qs=new URLSearchParams(location.search),lang=qs.get('lang')||localStorage.getItem('indomark_learn_language_v2')||'kn',teacher=qs.get('teacher')||localStorage.getItem('indomark_teacher_'+lang)||'vistara',raw=qs.get('category')||localStorage.getItem('indomark_learn_category_v1')||'Stock Market Basics';var map={basics:'Stock Market Basics',technical:'Technical Analysis',fundamental:'Fundamental Analysis',risk:'Risk Management',psychology:'Investor Psychology',education:'Investor Education'},category=map[String(raw).trim().toLowerCase()]||String(raw).trim()||'Stock Market Basics';document.getElementById('langChip').textContent='Language: '+(lang==='kn'?'ಕನ್ನಡ':lang);document.getElementById('teacherChip').textContent='Channel: '+(teacher==='vistara'?'Vistara Money Plus':teacher==='angel'?'Angel Investments':teacher);document.getElementById('catChip').textContent='Category: '+category;document.getElementById('back').href='learn-channel-v2.html?lang='+encodeURIComponent(lang)+'&category='+encodeURIComponent(category);var fallback=[{order:1,level:0,title:'ಏನಿದು Stock Market ? Stock Market ಹುಟ್ಟಿದ್ದು ಹೇಗೆ ? | History Of Stock Market',videoId:'g6kNBA-J7qI',description:'Stock market history ಮತ್ತು basic context.',source:'Vistara Money Plus'},{order:2,level:0,title:'Stock Market Basics For beginners | ಷೇರು ಮಾರುಕಟ್ಟೆ ಹೂಡಿಕೆ ಬಗ್ಗೆ ಕಂಪ್ಲೀಟ್ ಮಾಹಿತಿ |',videoId:'UucJL1nqejw',description:'Investment, trading, Demat account, broker, Nifty ಮತ್ತು Sensex basics.',source:'Vistara Money Plus'},{order:3,level:1,title:'Different Types Of Investment In Stock Market | ಹೂಡಿಕೆಯ ಪ್ರಮುಖ ವಿಧಗಳ ಸಮಗ್ರ ವಿವರ',videoId:'oBwtLi4tHfM',description:'Different investment types ಮತ್ತು approaches.',source:'Vistara Money Plus'},{order:4,level:2,title:'ಷೇರನ್ನು ಖರೀದಿಸುವ ಮುಂಚೆ ಇದನ್ನು ತಪ್ಪದೆ ಮಾಡಿ.! | Stock Market Investment In Kannada | Share Market',videoId:'jJSIm32W49Y',description:'Share ಖರೀದಿಸುವ ಮೊದಲು ಮಾಡಬೇಕಾದ practical checks.',source:'Vistara Money Plus'},{order:5,level:2,titl odeURIComponent(id)+'?enablejsapi=1&origin='+encodeURIComponent(location.origin)+'&controls=0&disablekb=1&rel=0&modestbranding=1&playsinline=1'}var player=null,timer=null,current=-1,last=0,pending=null,desired=false;function reset(){if(timer){clearInterval(timer);timer=null}player=null;current=-1;last=0;pending=null;desired=false}function render(){reset();updateSummary();var open=firstOpen(),groups={};videos.forEach(function(v,i){var l=Number.isFinite(Number(v.level))?Number(v.level):9999;(groups[l]||(groups[l]=[])).push({v:v,i:i})});var names={0:'Foundation',1:'Beginner Basics',2:'Core Concepts',3:'Technical Analysis',4:'Trading / Intraday',5:'F&O / Options / Futures',9999:'Verified Videos'},html='';Object.keys(groups).sort(function(a,b){return Number(a)-Number(b)}).forEach(function(level){var items=groups[level],levelDone=items.filter(function(x){return!!state.done[x.v.videoId]}).length;html+='<section class="level-block"><div class="level-head"><div class="level-top"><div class="kicker">Level '+esc(level)+'</div><div class="level-total">'+levelDone+' / '+items.length+' completed</div></div><h2>'+esc(names[level]||'Verified Videos')+'</h2><p>Finish the videos in sequence.</p></div>';items.forEach(function(x){var v=x.v,i=x.i,done=!!state.done[v.videoId],active=i===open,pos=Math.max(0,Number(state.pos[v.videoId]||0)),media;if(done)media='<div class="player"><iframe src="'+yt(v.videoId)+'" title="'+esc(v.title)+'" allow="encrypted-media;picture-in-picture"></iframe></div>';else if(active)media='<div class="player"><iframe id="activePlayer" src="'+yt(v.videoId)+'" title="'+esc(v.title)+'" allow="autoplay;encrypted-media;picture-in-picture"></iframe><div class="cover" id="videoCover"><button id="playBtn" type="button" aria-label="Play or pause">▶</button><span class="hint">Tap to play / pause</span></div>'+(pos?'<div class="resume">Resume '+Math.floor(pos/60)+':'+String(Math.floor(pos%60)).padStart(2,'0')+'</div>':'');else media='<div class="locked"><div class="lock">🔒</div><b>Video locked</b><small>Complete the previous video fully, without skipping, to unlock this one.</small></div>';html+='<article class="video-card">'+media+'<div class="body"><b>'+esc(v.title)+'</b><div class="meta-line"><strong>Level '+esc(level)+'</strong> · Video '+(i+1)+' of '+videos.length+'</div>'+(v.description?'<div class="what"><strong>ಈ videoನಲ್ಲಿ ಏನು ಇದೆ?</strong><br>'+esc(v.description)+'</div>':'')+'<small>'+esc(v.source||teacher)+'</small><span class="state '+(done?'done':active?'active':'locked-state')+'">'+(done?'✓ Completed':active?'● Continue watching':'🔒 Locked')+'</span></div></article>'});html+='</section>'});list.innerHTML=html;if(open>=0)attach(open)}function attach(index){var frame=document.getElementById('activePlayer'),cover=document.getElementById('videoCover'),button=document.getElementById('playBtn');if(!frame||!cover||!button)return;function click(e){e.preventDefault();e.stopPropagation();desired=!desired;pending=desired;if(player){try{desired?player.playVideo():player.pauseVideo();button.textContent=desired?'❚❚':'▶'}catch(x){}}}cover.addEventListener('click',click);function bind(){if(!window.YT||!window.YT.Player)return;try{player=new YT.Player('activePlayer',{events:{onReady:function(ev){var id=videos[index].videoId,p=Math.max(0,Number(state.pos[id]||0));if(p>0)try{ev.target.seekTo(p,true)}catch(e){}last=p;state.watched[id]=Math.max(Number(state.watched[id]||0),p);save();if(pending!==null){desired=pending;pending=null;try{desired?ev.target.playVideo():ev.target.pauseVideo();button.textContent=desired?'❚❚':'▶'}catch(e){}}},onStateChange:function(ev){if(ev.data===YT.PlayerState.PLAYING){desired=true;button.textContent='❚❚';if(!timer)timer=setInterval(function(){if(!player||document.hidden)return;try{var id=videos[index].videoId,now=Number(player.getCurrentTime()||0),delta=now-last;if(delta>2.5){var back=Number(state.pos[id]||0);player.seekTo(back,true);last=back;return}if(delta>=0){state.pos[id]=now;state.watched[id]=Math.max(Number(state.watched[id]||0),now);save()}last=now}catch(e){}},500)}else if(ev.data===YT.PlayerState.PAUSED){desired=false;button.textContent='▶';save()}else if(ev.data===YT.PlayerState.ENDED){if(timer){clearInterval(timer);timer=null}var id=videos[index].videoId,d=Number(ev.target.getDuration()||0),w=Number(state.watched[id]||0);if(d>0&&w>=d-1.5){state.done[id]=true;delete state.pos[id];delete state.watched[id];save();render()}}}}});}catch(e){}}if(window.YT&&window.YT.Player)bind();else{if(!document.querySelector('script[data-indomark-youtube]')){var s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.async=true;s.dataset.indomarkYoutube='1';document.head.appendChild(s)}var n=0,w=setInterval(function(){n++;if(window.YT&&window.YT.Player){clearInterval(w);bind()}else if(n>80)clearInterval(w)},250)}}window.addEventListener('pagehide',function(){if(current<0||!player)return;try{var id=videos[current].videoId,p=Number(player.getCurrentTime()||0);state.pos[id]=p;state.watched[id]=Math.max(Number(state.watched[id]||0),p);save()}catch(e){}});render();})();</script>
