<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}.page{min-height:100dvh;padding:16px 12px 90px}.wrap{width:min(1000px,100%);margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:10px;color:var(--text);font-size:30px;font-weight:900;line-height:1;letter-spacing:-1.7px;white-space:nowrap}.bolt{width:30px;height:30px;flex:0 0 30px;background:transparent url('../assets/indomark-compass-dark.svg?v=13') center/contain no-repeat}.back{width:40px;height:40px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--text);display:grid;place-items:center;text-decoration:none;font-size:18px}.hero{margin:18px 0 14px}.eyebrow{margin:0;color:var(--green);font-size:9px;font-weight:900;letter-spacing:1px}.hero h1{margin:5px 0 0;font-size:25px;color:var(--green)}.hero p{margin:6px 0 0;color:var(--muted);font-size:11px}.context{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chip{padding:7px 9px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:9px;color:var(--text)}.grid{display:grid;gap:12px;margin-top:12px}.level-block{display:grid;gap:8px}.level-head{padding:12px 13px;border:1px solid var(--line);border-radius:13px;background:linear-gradient(180deg,var(--panel-2),var(--panel))}.level-head .kicker{color:var(--green);font-size:8px;font-weight:900;letter-spacing:1px;text-transform:uppercase}.level-head h2{margin:4px 0 0;font-size:16px}.level-head p{margin:5px 0 0;color:var(--muted);font-size:10px;line-height:1.45}.video-card{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}.player{position:relative;aspect-ratio:16/9;background:#050914}.player iframe{width:100%;height:100%;border:0;display:block;pointer-events:none}.shield{position:absolute;inset:0;z-index:5;cursor:pointer}.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:rgba(0,0,0,.58);color:#fff;display:grid;place-items:center;font-size:22px}.resume{position:absolute;left:10px;bottom:10px;z-index:6;padding:5px 8px;border-radius:7px;background:rgba(0,0,0,.58);color:#fff;font-size:8px;font-weight:800;pointer-events:none}.locked{aspect-ratio:16/9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;background:var(--panel-2);color:var(--muted);text-align:center;padding:20px}.locked .lock{font-size:28px}.locked b{font-size:12px;color:var(--text)}.locked small{font-size:9px;line-height:1.4;max-width:290px}.body{padding:11px}.body b{display:block;font-size:12px;line-height:1.35}.body .what{margin-top:7px;padding-top:8px;border-top:1px solid var(--line-soft);font-size:10px;line-height:1.45}.body .what strong{color:var(--green)}.body small{display:block;margin-top:5px;color:var(--muted);font-size:9px}.state{display:inline-block;margin-top:7px;padding:4px 6px;border-radius:999px;font-size:8px;font-weight:900}.state.active{background:rgba(88,231,165,.12);color:var(--green)}.state.locked{background:rgba(148,163,184,.12);color:var(--muted)}.state.done{background:rgba(88,231,165,.16);color:var(--green)}.empty{padding:20px;border:1px dashed var(--line);border-radius:13px;color:var(--muted);font-size:11px;text-align:center}@media(max-width:640px){.page{padding-left:10px;padding-right:10px}.brand{font-size:36px;gap:8px}.bolt{width:28px;height:28px;flex-basis:28px}}@media(max-width:360px){.brand{font-size:36px;gap:7px}.bolt{width:26px;height:26px;flex-basis:26px}}

<body>
<main class="page"><div class="wrap">
<header class="top"><div class="brand"><span class="bolt" aria-hidden="true"></span><span>Indo<strong>mark</strong></span></div><a class="back" id="back" href="learn-channel-v2.html" aria-label="Back">←</a></header>
<section class="hero"><p class="eyebrow">STEP 4 OF 4</p><h1>Videos</h1><p>Watch each video fully to unlock the next one.</p><div class="context"><span class="chip" id="languageChip">Language</span><span class="chip" id="channelChip">Channel</span><span class="chip" id="categoryChip">Category</span></div></section>
<section class="grid" id="list"></section>
</div></main>
<script>
(function(){
'use strict';
var q=new URLSearchParams(location.search);
var lang=q.get('lang')||localStorage.getItem('indomark_learn_language_v2')||'kn';
var teacher=q.get('teacher')||localStorage.getItem('indomark_teacher_'+lang)||'vistara';
var raw=q.get('category')||localStorage.getItem('indomark_learn_category_v1')||'Stock Market Basics';
var map={basics:'Stock Market Basics',technical:'Technical Analysis',fundamental:'Fundamental Analysis',risk:'Risk Management',psychology:'Investor Psychology',education:'Investor Education'};
var category=map[String(raw).trim().toLowerCase()]||String(raw).trim()||'Stock Market Basics';
localStorage.setItem('indomark_learn_language_v2',lang);localStorage.setItem('indomark_learn_category_v1',category);localStorage.setItem('indomark_teacher_'+lang,teacher);
document.getElementById('languageChip').textContent='Language: '+(lang==='kn'?'ಕನ್ನಡ':lang);document.getElementById('channelChip').textContent='Channel: '+(teacher==='vistara'?'Vistara Money Plus':teacher==='angel'?'Angel Investments':teacher);document.getElementById('categoryChip').textContent='Category: '+category;document.getElementById('back').href='learn-channel-v2.html?lang='+encodeURIComponent(lang)+'&category='+encodeURIComponent(category);
var source=[];
if(lang==='kn'&&teacher==='vistara'&&Array.isArray(window.INDOMARK_VISTARA_KANNADA_VIDEOS))source=window.INDOMARK_VISTARA_KANNADA_VIDEOS.slice();
if(lang==='kn'&&teacher==='angel'&&Array.isArray(window.INDOMARK_ANGEL_INVESTMENTS_KANNADA_VIDEOS))source=window.INDOMARK_ANGEL_INVESTMENTS_KANNADA_VIDEOS.slice();
if(!source.length&&lang==='kn'&&teacher==='vistara'&&category==='Stock Market Basics')source=[
{level:0,order:1,title:'ಏನಿದು Stock Market ? Stock Market ಹುಟ್ಟಿದ್ದು ಹೇಗೆ ? | History Of Stock Market',videoId:'g6kNBA-J7qI',description:'Stock market history ಮತ್ತು basic context.',source:'Vistara Money Plus'},
{level:0,order:2,title:'Stock Market Basics For beginners | ಷೇರು ಮಾರುಕಟ್ಟೆ ಹೂಡಿಕೆ ಬಗ್ಗೆ ಕಂಪ್ಲೀಟ್ ಮಾಹಿತಿ |',videoId:'UucJL1nqejw',description:'Investment, trading, Demat account, broker, Nifty ಮತ್ತು Sensex basics.',source:'Vistara Money Plus'},
{level:1,order:3,title:'Different Types Of Investment In Stock Market | ಹೂಡಿಕೆಯ ಪ್ರಮುಖ ವಿಧಗಳ ಸಮಗ್ರ ವಿವರ',videoId:'oBwtLi4tHfM',description:'Different investment types ಮತ್ತು approaches.',source:'Vistara Money Plus'},
{level:2,order:4,title:'ಷೇರನ್ನು ಖರೀದಿಸುವ ಮುಂಚೆ ಇದನ್ನು ತಪ್ಪದೆ ಮಾಡಿ.! | Stock Market Investment In Kannada | Share Market',videoId:'jJSIm32W49Y',description:'Share ಖರೀದಿಸುವ ಮೊದಲು ಮಾಡಬೇಕಾದ practical checks.',source:'Vistara Money Plus'},
{level:2,order:5,title:'What Is Trading And How To Trade For Beginners In Kannada | How To Earn More Money In Trading',videoId:'_KHXlzU1f-M',description:'Trading basics ಮತ್ತು beginner mechanics.',source:'Vistara Money Plus'}];
var seen={};var videos=source.filter(function(v){return v&&v.videoId&&v.category===undefined||v&&v.videoId&&v.category===category;}).filter(function(v){if(seen[v.videoId]||v.videoId==='LLGkm3TTcCg'||v.verified===false)return false;seen[v.videoId]=true;return true;}).sort(function(a,b){return(Number(a.order)||999999)-(Number(b.order)||999999);});
var list=document.getElementById('list');
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
if(!videos.length){list.innerHTML='<div class="empty">ಈ channel/categoryಗೆ verified videos ಲಭ್ಯವಿಲ್ಲ.</div>';return;}
var key='indomark_video_learning_v10|'+lang+'|'+teacher+'|'+category;var progress={};try{var saved=JSON.parse(localStorage.getItem(key)||'{}');if(saved&&saved.done)progress=saved.done;}catch(e){}
function save(){try{localStorage.setItem(key,JSON.stringify({done:progress,pos:positions}));}catch(e){}}
var positions={};try{var ss=JSON.parse(localStorage.getItem(key)||'{}');if(ss&&ss.pos)positions=ss.pos;}catch(e){}
function firstOpen(){for(var i=0;i<videos.length;i++){if(!progress[videos[i].videoId])return i;}return -1;}
var activePlayer=null,activeTimer=null,activeIndex=-1,lastTime=0,invalid=false;
function ytUrl(id){return'https://www.youtube.com/embed/'+encodeURIComponent(id)+'?enablejsapi=1&controls=0&disablekb=1&rel=0&modestbranding=1&playsinline=1';}
function stop(){if(activeTimer){clearInterval(activeTimer);activeTimer=null;}if(activePlayer){try{activePlayer.destroy();}catch(e){}}activePlayer=null;activeIndex=-1;lastTime=0;invalid=false;}
function render(){stop();var open=firstOpen(),groups={};videos.forEach(function(v,i){var l=Number.isFinite(v.level)?v.level:9999;if(!groups[l])groups[l]=[];groups[l].push({v:v,i:i});});var names={0:'Foundation',1:'Beginner Basics',2:'Core Concepts',3:'Technical Analysis',4:'Trading / Intraday',5:'F&O / Options / Futures',9999:'Verified Videos'};var html='';Object.keys(groups).sort(function(a,b){return Number(a)-Number(b)}).forEach(function(l){html+='<section class="level-block"><div class="level-head"><div class="kicker">Level '+l+'</div><h2>'+esc(names[l]||('Level '+l))+'</h2><p>Complete the videos in sequence.</p></div>';groups[l].forEach(function(x){var v=x.v,i=x.i,done=!!progress[v.videoId],open=i===open,pos=Number(positions[v.videoId]||0),media;if(done){media='<div class="player"><iframe src="'+ytUrl(v.videoId)+'" title="'+esc(v.title)+'" allow="encrypted-media; picture-in-picture" allowfullscreen></iframe></div>'}else if(open){media='<div class="player"><iframe id="activePlayer" src="'+ytUrl(v.videoId)+'" title="'+esc(v.title)+'" allow="encrypted-media; picture-in-picture" allowfullscreen></iframe><div class="shield" id="shield"><span class="play">▶</span></div><div class="resume" id="resume">'+(pos?'Resume '+Math.floor(pos/60)+':'+String(Math.floor(pos%60)).padStart(2,'0'):'')+'</div></div>'}else{media='<div class="locked"><div class="lock">🔒</div><b>Video locked</b><small>Complete the previous video fully, without skipping, to unlock this one.</small></div>'}html+='<article class="video-card">'+media+'<div class="body"><b>'+esc(v.title)+'</b>'+(v.description?'<div class="what"><strong>ಈ videoನಲ್ಲಿ ಏನು ಇದೆ?</strong><br>'+esc(v.description)+'</div>':'')+'<small>'+esc(v.source||teacher)+'</small><span class="state '+(done?'done':open?'active':'locked')+'">'+(done?'✓ Completed':open?'● Continue watching':'🔒 Locked')+'</span></div></article>'});html+='</section>'});list.innerHTML=html;if(open>=0)attach(open);}
function attach(i){var frame=document.getElementById('activePlayer'),shield=document.getElementById('shield');if(!frame)return;function boot(){if(!window.YT||!window.YT.Player)return;try{activeIndex=i;activePlayer=new YT.Player('activePlayer',{events:{onReady:function(ev){var p=Number(positions[videos[i].videoId]||0);if(p>0)try{ev.target.seekTo(p,true)}catch(e){}lastTime=p},onStateChange:function(ev){if(ev.data===YT.PlayerState.PAUSED)persist();if(ev.data===YT.PlayerState.ENDED){persist();var d=Number(ev.target.getDuration()||0),p=Number(positions[videos[i].videoId]||0);if(!invalid&&d>0&&p>=Math.max(0,d-2.5)){progress[videos[i].videoId]=true;delete positions[videos[i].videoId];save();render()}else{try{ev.target.seekTo(p,true);ev.target.playVideo()}catch(e){}}}}});activeTimer=setInterval(function(){if(!activePlayer||document.hidden)return;try{var now=Number(activePlayer.getCurrentTime()||0),s=activePlayer.getPlayerState();if(s===YT.PlayerState.PLAYING){var d=now-lastTime;if(lastTime>0&&d>2){invalid=true;var p=Number(positions[videos[i].videoId]||0);activePlayer.seekTo(p,true)}else if(d>=0&&d<=2){positions[videos[i].videoId]=now;if(Math.floor(now)%3===0)save()}lastTime=Number(positions[videos[i].videoId]||now)}}catch(e){}},500)}catch(e){}}
if(window.YT&&window.YT.Player){boot();return;}if(document.querySelector('script[data-indomark-yt]'))return;var s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.async=true;s.dataset.indomarkYt='1';var old=window.onYouTubeIframeAPIReady;window.onYouTubeIframeAPIReady=function(){try{if(typeof old==='function')old()}catch(e){}boot()};document.head.appendChild(s)}
function persist(){if(activeIndex<0||!activePlayer)return;try{var p=Number(activePlayer.getCurrentTime()||0);if(p>0){positions[videos[activeIndex].videoId]=p;save();var b=document.getElementById('resume');if(b)b.textContent='Resume '+Math.floor(p/60)+':'+String(Math.floor(p%60)).padStart(2,'0')}}catch(e){}}
if(document.getElementById('shield'))document.getElementById('shield').addEventListener('click',function(){if(!activePlayer)return;try{if(activePlayer.getPlayerState()===YT.PlayerState.PLAYING)activePlayer.pauseVideo();else activePlayer.playVideo()}catch(e){}});
window.addEventListener('pagehide',persist);document.addEventListener('visibilitychange',function(){if(document.hidden)persist()});
render();
})();
</script>
</body></html>
