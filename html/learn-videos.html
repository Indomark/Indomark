<script>
(function(){
'use strict';
var q=new URLSearchParams(location.search);
var lang=q.get('lang')||localStorage.getItem('indomark_learn_language_v2')||'kn';
var teacher=q.get('teacher')||localStorage.getItem('indomark_teacher_'+lang)||'vistara';
var raw=q.get('category')||localStorage.getItem('indomark_learn_category_v1')||'Stock Market Basics';
var map={basics:'Stock Market Basics',technical:'Technical Analysis',fundamental:'Fundamental Analysis',risk:'Risk Management',psychology:'Investor Psychology',education:'Investor Education'};
var category=map[String(raw).trim().toLowerCase()]||String(raw).trim()||'Stock Market Basics';
var hubLevels={'Stock Market Basics':1,'Technical Analysis':2,'Fundamental Analysis':3,'Risk Management':4,'Investor Psychology':5};
document.getElementById('langChip').textContent='Language: '+(lang==='kn'?'ಕನ್ನಡ':lang);
document.getElementById('teacherChip').textContent='Channel: '+(teacher==='vistara'?'Vistara Money Plus':teacher==='angel'?'Angel Investments':teacher);
document.getElementById('catChip').textContent='Category: '+category;
document.getElementById('back').href='learn-channel-v2.html?lang='+encodeURIComponent(lang)+'&category='+encodeURIComponent(category);
var fallback=[{order:1,level:0,title:'ಏನಿದು Stock Market ? Stock Market ಹುಟ್ಟಿದ್ದು ಹೇಗೆ ? | History Of Stock Market',videoId:'g6kNBA-J7qI',description:'Stock market history ಮತ್ತು basic context.',source:'Vistara Money Plus'},{order:2,level:0,title:'Stock Market Basics For beginners | ಷೇರು ಮಾರುಕಟ್ಟೆ ಹೂಡಿಕೆ ಬಗ್ಗೆ ಕಂಪ್ಲೀಟ್ ಮಾಹಿತಿ |',videoId:'UucJL1nqejw',description:'Investment, trading, Demat account, broker, Nifty ಮತ್ತು Sensex basics.',source:'Vistara Money Plus'},{order:3,level:1,title:'Different Types Of Investment In Stock Market | ಹೂಡಿಕೆಯ ಪ್ರಮುಖ ವಿಧಗಳ ಸಮಗ್ರ ವಿವರ',videoId:'oBwtLi4tHfM',description:'Different investment types ಮತ್ತು approaches.',source:'Vistara Money Plus'},{order:4,level:2,title:'ಷೇರನ್ನು ಖರೀದಿಸುವ ಮುಂಚೆ ಇದನ್ನು ತಪ್ಪದೆ ಮಾಡಿ.! | Stock Market Investment In Kannada | Share Market',videoId:'jJSIm32W49Y',description:'Share ಖರೀದಿಸುವ ಮೊದಲು ಮಾಡಬೇಕಾದ practical checks.',source:'Vistara Money Plus'},{order:5,level:2,title:'What Is Trading And How To Trade For Beginners In Kannada | How To Earn More Money In Trading',videoId:'_KHXlzU1f-M',description:'Trading basics ಮತ್ತು beginner mechanics.',source:'Vistara Money Plus'}];
function getVideos(){var a=[];try{if(lang==='kn'&&teacher==='vistara'&&typeof window.getIndomarkVistaraVideos==='function')a=window.getIndomarkVistaraVideos(category);else if(lang==='kn'&&teacher==='angel'&&typeof window.getIndomarkAngelInvestmentsVideos==='function')a=window.getIndomarkAngelInvestmentsVideos(category);}catch(e){a=[];}if(!Array.isArray(a)||!a.length){if(lang==='kn'&&teacher==='vistara'&&category==='Stock Market Basics')a=fallback.slice();}var seen={};return(Array.isArray(a)?a:[]).filter(function(v){if(!v||!v.videoId||v.verified===false||v.videoId==='LLGkm3TTcCg'||seen[v.videoId])return false;if(v.category&&v.category!==category)return false;seen[v.videoId]=1;return true;}).sort(function(a,b){return(Number(a.order)||999999)-(Number(b.order)||999999);});}
var videos=getVideos(),list=document.getElementById('list');
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;');}
if(!videos.length){list.innerHTML='<div class="empty">ಈ channel/categoryಗೆ verified videos ಲಭ್ಯವಿಲ್ಲ.</div>';return;}
var progressKey='indomark_learning_progress_v3|'+lang+'|'+teacher+'|'+category;var progress={completed:{},position:{},watchedMax:{}};try{var saved=JSON.parse(localStorage.getItem(progressKey)||'{}');if(saved&&saved.completed)progress.completed=saved.completed;if(saved&&saved.position)progress.position=saved.position;if(saved&&saved.watchedMax)progress.watchedMax=saved.watchedMax;}catch(e){}
function save(){try{localStorage.setItem(progressKey,JSON.stringify(progress));}catch(e){}}function isDone(id){return !!progress.completed[id];}function firstLockedIndex(){for(var i=0;i<videos.length;i++)if(!isDone(videos[i].videoId))return i;return -1;}function yt(id){return 'https://www.youtube.com/embed/'+encodeURIComponent(id)+'?enablejsapi=1&origin='+encodeURIComponent(location.origin)+'&rel=0&modestbranding=1&playsinline=1&controls=1&fs=1';}
var activePlayer=null,activeIndex=-1,timer=null,lastTime=0,seekLock=false;function stopTracker(){if(timer){clearInterval(timer);timer=null;}activePlayer=null;activeIndex=-1;lastTime=0;seekLock=false;}function updateSummary(levels){var done=videos.filter(function(v){return isDone(v.videoId);}).length;document.getElementById('totalCount').textContent=videos.length;document.getElementById('levelCount').textContent=levels.length;document.getElementById('completedCount').textContent=done;document.getElementById('remainingCount').textContent=videos.length-done;}
function render(){stopTracker();var unlock=firstLockedIndex(),group={level:hubLevels[category]||1,items:[]};videos.forEach(function(v,i){group.items.push({v:v,i:i});});var levels=[group.level];var displayLevel=group.level;updateSummary(levels);var html='<section class="level-block">';group.items.forEach(function(x,localIndex){var v=x.v,i=x.i,done=isDone(v.videoId),playable=done||i===unlock,pos=Math.max(0,Number(progress.position[v.videoId]||0));var media;if(playable){media='<div class="player"><iframe data-video-index="'+i+'" src="'+yt(v.videoId)+'" title="'+esc(v.title)+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen"></iframe></div>';}else{media='<div class="locked"><div class="lock">🔒</div><b>Video locked</b><small>Complete the previous video fully to unlock this one.</small></div>';}html+='<article class="video-card"><div class="video-meta-head"><span class="level-label">LEVEL '+esc(displayLevel)+'</span><span class="video-number">VIDEO NO. '+esc(localIndex+1)+'</span></div>'+media+'<div class="body"><b>'+esc(v.title)+'</b>'+(v.description?'<div class="what"><strong>ಈ videoನಲ್ಲಿ ಏನು ಇದೆ?</strong><br>'+esc(v.description)+'</div>':'')+'<small>'+esc(v.source||teacher)+'</small><span class="state '+(done?'done':playable?'active':'locked-state')+'">'+(done?'✓ Completed':playable?'● Continue watching':'🔒 Locked')+'</span>'+(playable&&pos&&!done?'<small>Saved position: '+Math.floor(pos/60)+':'+String(Math.floor(pos%60)).padStart(2,'0')+'</small>':'')+'</div></article>';});html+='</section>';list.innerHTML=html;attachPlayers();}
function attachPlayers(){var frames=list.querySelectorAll('iframe[data-video-index]');frames.forEach(function(frame){frame.addEventListener('load',function(){try{frame.contentWindow.postMessage(JSON.stringify({event:'listening',id:1,channel:'channel1'}),'https://www.youtube.com');}catch(e){}});});var idx=firstLockedIndex();if(idx<0)return;var active=list.querySelector('iframe[data-video-index="'+idx+'"]');if(!active)return;function startApi(){if(!window.YT||!window.YT.Player)return;stopTracker();activePlayer=new YT.Player(active,{events:{onReady:function(ev){activePlayer=ev.target;activeIndex=idx;var id=videos[idx].videoId,p=Math.max(0,Number(progress.position[id]||0));lastTime=p;if(p>0){try{ev.target.seekTo(p,true);}catch(e){}}save();},onStateChange:function(ev){if(ev.data===YT.PlayerState.PLAYING){if(timer)clearInterval(timer);timer=setInterval(function(){if(!activePlayer||activeIndex<0)return;try{var id=videos[activeIndex].videoId,now=Number(activePlayer.getCurrentTime()||0),delta=now-lastTime;if(seekLock){seekLock=false;lastTime=Number(progress.position[id]||0);return;}if(delta>2.5){var allowed=Number(progress.position[id]||0);seekLock=true;activePlayer.seekTo(allowed,true);lastTime=allowed;return;}if(delta>=0&&delta<=2.5){progress.position[id]=now;progress.watchedMax[id]=Math.max(Number(progress.watchedMax[id]||0),now);lastTime=now;save();}}catch(e){}},500);}else if(ev.data===YT.PlayerState.PAUSED){try{var pid=videos[idx].videoId;progress.position[pid]=Number(ev.target.getCurrentTime()||progress.position[pid]||0);save();}catch(e){}}else if(ev.data===YT.PlayerState.ENDED){if(timer){clearInterval(timer);timer=null;}try{var eid=videos[idx].videoId,duration=Number(ev.target.getDuration()||0),watched=Number(progress.watchedMax[eid]||0),position=Number(progress.position[eid]||0);if(duration>0&&watched>=duration-1.5&&position>=duration-1.5){progress.completed[eid]=true;delete progress.position[eid];save();render();}}catch(e){}}}}});}if(window.YT&&window.YT.Player)startApi();else if(!document.querySelector('script[data-indomark-yt-api]')){var s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.async=true;s.dataset.indomarkYtApi='1';document.head.appendChild(s);}var tries=0,wait=setInterval(function(){tries++;if(window.YT&&window.YT.Player){clearInterval(wait);startApi();}else if(tries>80)clearInterval(wait);},250);}
window.addEventListener('pagehide',function(){if(!activePlayer||activeIndex<0)return;try{var id=videos[activeIndex].videoId,now=Number(activePlayer.getCurrentTime()||0);progress.position[id]=now;save();}catch(e){}});window.addEventListener('beforeunload',function(){if(!activePlayer||activeIndex<0)return;try{var id=videos[activeIndex].videoId,now=Number(activePlayer.getCurrentTime()||0);progress.position[id]=now;save();}catch(e){}});render();
})();
document.getElementById('notificationButton')?.addEventListener('click',()=>window.location.assign('notifications.html'));
</script>
