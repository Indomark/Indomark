<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="cache-control" content="no-store">
<meta name="theme-color" content="#050914">
<title>Indomark — Videos</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,Helvetica,sans-serif;background:#050914;color:#fff}.page{min-height:100dvh;padding:16px 12px 90px}.wrap{width:min(1000px,100%);margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-size:30px;font-weight:900;line-height:1;letter-spacing:-1.7px;white-space:nowrap}.brand .bolt{width:30px;height:30px;flex:0 0 30px;background:transparent url('../assets/indomark-compass-dark.svg?v=3') center/contain no-repeat}.back{width:40px;height:40px;border:1px solid #273246;border-radius:11px;background:#0b1220;color:#fff;display:grid;place-items:center;text-decoration:none;font-size:18px}.hero{margin:18px 0 14px}.eyebrow{margin:0;color:#58e7a5;font-size:9px;font-weight:900;letter-spacing:1px}.hero h1{margin:5px 0 0;font-size:25px;color:#58e7a5}.hero p{margin:6px 0 0;color:#aeb9c8;font-size:11px}.context{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chip{padding:7px 9px;border:1px solid #273246;border-radius:999px;background:#0b1220;color:#fff;font-size:9px}.grid{display:grid;gap:12px;margin-top:12px}.level-block{display:grid;gap:8px}.level-head{padding:12px 13px;border:1px solid #273246;border-radius:13px;background:#0b1220}.level-head .kicker{color:#58e7a5;font-size:8px;font-weight:900;letter-spacing:1px;text-transform:uppercase}.level-head h2{margin:4px 0 0;font-size:16px}.level-head p{margin:5px 0 0;color:#aeb9c8;font-size:10px;line-height:1.45}.video-card{border:1px solid #273246;border-radius:14px;background:#0b1220;overflow:hidden}.player{aspect-ratio:16/9;background:#050914}.player iframe{width:100%;height:100%;border:0;display:block}.locked-player{aspect-ratio:16/9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;background:#101827;color:#aeb9c8;text-align:center;padding:20px}.locked-player .lock{font-size:28px}.locked-player b{font-size:12px;color:#fff}.locked-player small{font-size:9px;line-height:1.4;max-width:280px}.body{padding:11px}.body b{display:block;font-size:12px;line-height:1.35}.body .what{margin-top:7px;padding-top:8px;border-top:1px solid #1b2535;font-size:10px;line-height:1.45}.body .what strong{color:#58e7a5}.body small{display:block;margin-top:5px;color:#aeb9c8;font-size:9px}.video-state{display:inline-block;margin-top:7px;padding:4px 6px;border-radius:999px;font-size:8px;font-weight:900}.video-state.active{background:rgba(88,231,165,.12);color:#58e7a5}.video-state.locked{background:rgba(148,163,184,.12);color:#aeb9c8}.video-state.done{background:rgba(88,231,165,.16);color:#58e7a5}.empty{padding:20px;border:1px dashed #273246;border-radius:13px;color:#aeb9c8;font-size:11px;text-align:center}@media(max-width:640px){.page{padding-left:10px;padding-right:10px}.brand{font-size:36px;gap:8px}.brand .bolt{width:28px;height:28px;flex-basis:28px}.hero h1{font-size:25px}}@media(max-width:360px){.brand{font-size:36px;gap:7px}.brand .bolt{width:26px;height:26px;flex-basis:26px}}
</style>
</head>
<body>
<main class="page"><div class="wrap">
<header class="top"><div class="brand"><span class="bolt" aria-hidden="true"></span><span>Indo<strong>mark</strong></span></div><a class="back" id="back" href="learn-channel-v2.html" aria-label="Back">←</a></header>
<section class="hero"><p class="eyebrow">STEP 4 OF 4</p><h1>Videos</h1><p>Watch each video fully to unlock the next one.</p><div class="context"><span class="chip" id="languageChip">Language</span><span class="chip" id="channelChip">Channel</span><span class="chip" id="categoryChip">Category</span></div></section>
<section class="grid" id="list"></section>
</div></main>
<script src="../js/settings.js?v=11"></script>
<script src="../js/vistara-kannada-video-catalog.js?v=20260830-3"></script>
<script src="../js/angel-investments-kannada-video-catalog.js?v=20260830-3"></script>
<script>
(function(){'use strict';
var p=new URLSearchParams(location.search);
var lang=p.get('lang')||localStorage.getItem('indomark_learn_language_v2')||'en';
var teacher=p.get('teacher')||localStorage.getItem('indomark_teacher_'+lang)||'';
var rawCategory=p.get('category')||localStorage.getItem('indomark_learn_category_v1')||'Stock Market Basics';
var categoryMap={basics:'Stock Market Basics',technical:'Technical Analysis',fundamental:'Fundamental Analysis',risk:'Risk Management',psychology:'Investor Psychology',education:'Investor Education'};
var category=categoryMap[String(rawCategory).trim().toLowerCase()]||String(rawCategory).trim();
localStorage.setItem('indomark_learn_language_v2',lang);localStorage.setItem('indomark_learn_category_v1',category);
if(teacher)localStorage.setItem('indomark_teacher_'+lang,teacher);
var teacherName=teacher==='vistara'?'Vistara Money Plus':teacher==='angel'?'Angel Investments':teacher||'—';
document.getElementById('languageChip').textContent='Language: '+(lang==='kn'?'ಕನ್ನಡ':lang);
document.getElementById('channelChip').textContent='Channel: '+teacherName;
document.getElementById('categoryChip').textContent='Category: '+category;
document.getElementById('back').href='learn-channel-v2.html?lang='+encodeURIComponent(lang)+'&category='+encodeURIComponent(category);

var removed=new Set(['LLGkm3TTcCg']);
var key='indomark_learning_progress_v5|'+lang+'|'+teacher+'|'+category;
var completed=new Set();
try{var saved=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(saved))completed=new Set(saved.filter(Boolean));}catch(e){}
function save(){localStorage.setItem(key,JSON.stringify(Array.from(completed)));}

function resolveVideos(){
 var list=[];
 if(lang==='kn'&&teacher==='vistara'&&typeof window.getVistaraVideos==='function') list=window.getVistaraVideos(category);
 if(lang==='kn'&&teacher==='angel'&&typeof window.getAngelInvestmentsVideos==='function') list=window.getAngelInvestmentsVideos(category);
 if(!Array.isArray(list))list=[];
 var seen=new Set();
 return list.filter(function(v){return v&&v.videoId&&!removed.has(v.videoId)&&!seen.has(v.videoId);}).map(function(v){seen.add(v.videoId);return v;}).sort(function(a,b){return (Number(a.order)||999999)-(Number(b.order)||999999);});
}
var videos=resolveVideos();
var listEl=document.getElementById('list');
var activePlayer=null,ytTimer=null,lastTime=0,watched=0,trackingIndex=-1;
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function activeIndex(){for(var i=0;i<videos.length;i++){if(!completed.has(videos[i].videoId))return i;}return -1;}
function unlocked(i){return i===0||completed.has(videos[i-1].videoId)&&videos.slice(0,i-1).every(function(v){return completed.has(v.videoId);});}
function playerUrl(id){return 'https://www.youtube.com/embed/'+encodeURIComponent(id)+'?enablejsapi=1&controls=1&disablekb=1&rel=0&modestbranding=1&playsinline=1';}
function stopTracking(){if(ytTimer){clearInterval(ytTimer);ytTimer=null;}if(activePlayer){try{activePlayer.destroy();}catch(e){}activePlayer=null;}trackingIndex=-1;lastTime=0;watched=0;}
function startTracking(){stopTracking();var i=activeIndex();var el=document.getElementById('activePlayer');if(i<0||!el)return;trackingIndex=i;var start=function(){if(!window.YT||!window.YT.Player||!document.getElementById('activePlayer'))return;try{activePlayer=new window.YT.Player('activePlayer',{events:{onReady:function(ev){lastTime=0;watched=0;try{ev.target.seekTo(0,true);}catch(e){}},onStateChange:function(ev){if(ev.data===window.YT.PlayerState.ENDED){var d=Number(ev.target.getDuration()||0);if(d>0&&watched>=Math.max(0,d-2.5)){completed.add(videos[trackingIndex].videoId);save();render();}else{try{ev.target.seekTo(0,true);ev.target.playVideo();}catch(e){}}}}});ytTimer=setInterval(function(){if(!activePlayer||document.hidden)return;try{var now=Number(activePlayer.getCurrentTime()||0);var delta=now-lastTime;if(delta>1.8){activePlayer.seekTo(lastTime,true);}else if(delta>=0&&delta<1.8&&activePlayer.getPlayerState()===window.YT.PlayerState.PLAYING){watched+=delta;}lastTime=now;}catch(e){}},500);}catch(e){}}
 if(window.YT&&window.YT.Player){start();return;}if(document.querySelector('script[data-indomark-yt]'))return;var s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.async=true;s.dataset.indomarkYt='1';var old=window.onYouTubeIframeAPIReady;window.onYouTubeIframeAPIReady=function(){try{if(typeof old==='function')old();}catch(e){}start();};document.head.appendChild(s);
}
function render(){
 stopTracking();
 if(!videos.length){listEl.innerHTML='<div class="empty">ಈ channel/categoryಗೆ verified videos ಲಭ್ಯವಿಲ್ಲ.</div>';return;}
 var html='';var groups=[];var byLevel=new Map();videos.forEach(function(v,i){var level=Number.isFinite(v.level)?v.level:9999;if(!byLevel.has(level))byLevel.set(level,[]);byLevel.get(level).push({v:v,i:i});});
 var names={0:'Foundation',1:'Beginner Basics',2:'Core Concepts',3:'Technical Analysis',4:'Trading / Intraday',5:'F&O / Options / Futures',9999:'Verified Videos'};
 var desc={0:'Start here and build the basic foundation.',1:'Beginner lessons that build on the foundation.',2:'Core concepts after the beginner stage.',3:'Charts and technical-analysis concepts.',4:'Active trading and intraday concepts.',5:'Advanced derivatives concepts.',9999:'Verified lessons for the selected category.'};
 byLevel.forEach(function(items,level){html+='<section class="level-block"><div class="level-head"><div class="kicker">Level '+level+'</div><h2>'+esc(names[level]||('Level '+level))+'</h2><p>'+esc(desc[level]||'Continue in sequence after the earlier lesson.')+'</p></div>';items.forEach(function(x){var v=x.v,i=x.i,done=completed.has(v.videoId),isOpen=unlocked(i)&&i===activeIndex(),media;if(done){media='<div class="player"><iframe src="'+playerUrl(v.videoId)+'" title="'+esc(v.title)+'" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>';}else if(isOpen){media='<div class="player"><iframe id="activePlayer" src="'+playerUrl(v.videoId)+'" title="'+esc(v.title)+'" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>';}else{media='<div class="locked-player"><div class="lock">🔒</div><b>Video locked</b><small>Complete the previous video fully, without skipping, to unlock this one.</small></div>';}html+='<article class="video-card">'+media+'<div class="body"><b>'+esc(v.title)+'</b>'+(v.description?'<div class="what"><strong>ಈ videoನಲ್ಲಿ ಏನು ಇದೆ?</strong><br>'+esc(v.description)+'</div>':'')+'<small>'+esc(v.source||teacherName)+'</small><span class="video-state '+(done?'done':isOpen?'active':'locked')+'">'+(done?'✓ Completed':isOpen?'● Watch fully to unlock next':'🔒 Locked')+'</span></div></article>';});html+='</section>';});
 listEl.innerHTML=html;startTracking();
}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&activeIndex()>=0)startTracking();});
render();
})();
</script>
</body>
</html>
