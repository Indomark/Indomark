<script src="../js/settings.js?v=11"></script>

<title>Indomark — Videos</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}.page{min-height:100dvh;padding:16px 12px 90px}.wrap{width:min(1000px,100%);margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font-size:30px;font-weight:900;line-height:1;letter-spacing:-1.7px;white-space:nowrap}.bolt{width:30px;height:30px;flex:0 0 30px;background:transparent url('../assets/indomark-compass-dark.svg?v=5') center/contain no-repeat}.back{width:40px;height:40px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--text);display:grid;place-items:center;text-decoration:none;font-size:18px}.hero{margin:18px 0 14px}.eyebrow{margin:0;color:var(--green);font-size:9px;font-weight:900;letter-spacing:1px}.hero h1{margin:5px 0 0;font-size:25px;color:var(--green)!important}.hero p{margin:6px 0 0;color:var(--muted);font-size:11px}.context{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chip{padding:7px 9px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:9px;color:var(--text)}.grid{display:grid;gap:12px;margin-top:12px}.level-block{display:grid;gap:8px}.level-head{padding:12px 13px;border:1px solid var(--line);border-radius:13px;background:linear-gradient(180deg,var(--panel-2),var(--panel))}.level-head .kicker{color:var(--green);font-size:8px;font-weight:900;letter-spacing:1px;text-transform:uppercase}.level-head h2{margin:4px 0 0;font-size:16px}.level-head p{margin:5px 0 0;color:var(--muted);font-size:10px;line-height:1.45}.video-card{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}.player{aspect-ratio:16/9;background:#050914}.player iframe{width:100%;height:100%;border:0;display:block}.locked-player{aspect-ratio:16/9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;background:var(--panel-2);color:var(--muted);text-align:center;padding:20px}.locked-player .lock{font-size:28px;line-height:1}.locked-player b{font-size:12px;color:var(--text)}.locked-player small{font-size:9px;line-height:1.4;max-width:290px}.body{padding:11px}.body b{display:block;font-size:12px;line-height:1.35}.body .what{margin-top:7px;padding-top:8px;border-top:1px solid var(--line-soft);font-size:10px;line-height:1.45}.body .what strong{color:var(--green)}.body small{display:block;margin-top:5px;color:var(--muted);font-size:9px}.state{display:inline-block;margin-top:7px;padding:4px 6px;border-radius:999px;font-size:8px;font-weight:900}.state.active{background:rgba(88,231,165,.12);color:var(--green)}.state.locked{background:rgba(148,163,184,.12);color:var(--muted)}.state.done{background:rgba(88,231,165,.16);color:var(--green)}.empty{padding:20px;border:1px dashed var(--line);border-radius:13px;color:var(--muted);font-size:11px;text-align:center}@media(max-width:640px){.page{padding-left:10px;padding-right:10px}.brand{font-size:36px;gap:8px}.bolt{width:28px;height:28px;flex-basis:28px}}@media(max-width:360px){.brand{font-size:36px;gap:7px}.bolt{width:26px;height:26px;flex-basis:26px}}
</style>
</head>
<body>
<main class="page"><div class="wrap">
<header class="top"><div class="brand"><span class="bolt" aria-hidden="true"></span><span>Indo<strong>mark</strong></span></div><a class="back" id="back" href="learn-channel-v2.html" aria-label="Back">←</a></header>
<section class="hero"><p class="eyebrow">STEP 4 OF 4</p><h1>Videos</h1><p>Complete each video fully to unlock the next one.</p><div class="context"><span class="chip" id="languageChip">Language</span><span class="chip" id="channelChip">Channel</span><span class="chip" id="categoryChip">Category</span></div></section>
<section class="grid" id="list"></section>
</div></main>
<script>
(function(){'use strict';
var p=new URLSearchParams(location.search);
var lang=p.get('lang')||localStorage.getItem('indomark_learn_language_v2')||'en';
var teacher=p.get('teacher')||localStorage.getItem('indomark_teacher_'+lang)||'';
var raw=p.get('category')||localStorage.getItem('indomark_learn_category_v1')||'Stock Market Basics';
var map={basics:'Stock Market Basics',technical:'Technical Analysis',fundamental:'Fundamental Analysis',risk:'Risk Management',psychology:'Investor Psychology',education:'Investor Education'};
var category=map[String(raw).trim().toLowerCase()]||String(raw).trim();
localStorage.setItem('indomark_learn_language_v2',lang);localStorage.setItem('indomark_learn_category_v1',category);if(teacher)localStorage.setItem('indomark_teacher_'+lang,teacher);
document.getElementById('languageChip').textContent='Language: '+(lang==='kn'?'ಕನ್ನಡ':lang);
document.getElementById('channelChip').textContent='Channel: '+(teacher==='vistara'?'Vistara Money Plus':teacher==='angel'?'Angel Investments':teacher||'—');
document.getElementById('categoryChip').textContent='Category: '+category;
document.getElementById('back').href='learn-channel-v2.html?lang='+encodeURIComponent(lang)+'&category='+encodeURIComponent(category);
var videos=[];
if(lang==='kn'&&teacher==='vistara'&&typeof window.getIndomarkVistaraVideos==='function')videos=window.getIndomarkVistaraVideos(category);
else if(lang==='kn'&&teacher==='angel'&&typeof window.getIndomarkAngelInvestmentsVideos==='function')videos=window.getIndomarkAngelInvestmentsVideos(category);
var removed=new Set(['LLGkm3TTcCg']);
var seen=new Set();
videos=(Array.isArray(videos)?videos:[]).filter(function(v){return v&&v.videoId&&!removed.has(v.videoId)&&!seen.has(v.videoId)&&seen.add(v.videoId);}).sort(function(a,b){return(Number(a.order)||999999)-(Number(b.order)||999999);});
var progressKey='indomark_video_progress_v6|'+lang+'|'+teacher+'|'+category;
var completed=new Set();
try{var saved=JSON.parse(localStorage.getItem(progressKey)||'[]');if(Array.isArray(saved))completed=new Set(saved.filter(Boolean));}catch(e){}
var listEl=document.getElementById('list');var activePlayer=null;var activeTimer=null;var activeIndex=-1;var lastTime=0;var watchedTime=0;var violated=false;
function save(){localStorage.setItem(progressKey,JSON.stringify(Array.from(completed)));}
function currentIndex(){for(var i=0;i<videos.length;i++)if(!completed.has(videos[i].videoId))return i;return -1;}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function clearTracker(){if(activeTimer){clearInterval(activeTimer);activeTimer=null}if(activePlayer){try{activePlayer.destroy()}catch(e){}activePlayer=null}activeIndex=-1;lastTime=0;watchedTime=0;violated=false;}
function ytSrc(id){return'https://www.youtube.com/embed/'+encodeURIComponent(id)+'?enablejsapi=1&controls=1&disablekb=1&rel=0&modestbranding=1&playsinline=1';}
function startTracker(){
clearTracker();var i=currentIndex();var el=document.getElementById('activePlayer');if(i<0||!el)return;activeIndex=i;
var boot=function(){if(!window.YT||!window.YT.Player||!document.getElementById('activePlayer'))return;try{activePlayer=new YT.Player('activePlayer',{events:{onReady:function(ev){try{ev.target.seekTo(0,true)}catch(e){}},onStateChange:function(ev){if(ev.data===YT.PlayerState.PLAYING){return}if(ev.data===YT.PlayerState.ENDED){var duration=Number(ev.target.getDuration()||0);var ok=!violated&&duration>0&&watchedTime>=Math.max(0,duration-2.5);if(ok){completed.add(videos[activeIndex].videoId);save();render();}else{try{ev.target.seekTo(0,true);ev.target.playVideo()}catch(e){}}}}}});activeTimer=setInterval(function(){if(!activePlayer||document.hidden)return;try{var now=Number(activePlayer.getCurrentTime()||0);var state=activePlayer.getPlayerState();if(state===YT.PlayerState.PLAYING){var delta=now-lastTime;if(lastTime>0&&delta>1.4){violated=true;watchedTime=0;try{activePlayer.seekTo(0,true)}catch(e){}}else if(delta>=0&&delta<=1.4){watchedTime+=delta}lastTime=now;}else{lastTime=now}}catch(e){}},500)}catch(e){}}
if(window.YT&&window.YT.Player){boot();return}if(document.querySelector('script[data-indomark-yt]'))return;var s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.async=true;s.dataset.indomarkYt='1';var old=window.onYouTubeIframeAPIReady;window.onYouTubeIframeAPIReady=function(){try{if(typeof old==='function')old()}catch(e){}boot()};document.head.appendChild(s);
}
function render(){
clearTracker();
if(!videos.length){listEl.innerHTML='<div class="empty">ಈ channel/categoryಗೆ verified videos ಲಭ್ಯವಿಲ್ಲ.</div>';return}
var active=currentIndex();var grouped=new Map();videos.forEach(function(v,i){var level=Number.isFinite(v.level)?v.level:9999;if(!grouped.has(level))grouped.set(level,[]);grouped.get(level).push({v:v,i:i})});
var names={0:'Foundation',1:'Beginner Basics',2:'Core Concepts',3:'Technical Analysis',4:'Trading / Intraday',5:'F&O / Options / Futures',9999:'Verified Videos'};
var desc={0:'Start here and build the basic foundation.',1:'Build practical beginner understanding.',2:'Understand the important core concepts.',3:'Learn charts and technical tools.',4:'Learn active trading concepts.',5:'Advanced derivatives concepts.',9999:'Verified lessons for this category.'};
var html='';grouped.forEach(function(items,level){html+='<section class="level-block"><div class="level-head"><div class="kicker">Level '+level+'</div><h2>'+esc(names[level]||('Level '+level))+'</h2><p>'+esc(desc[level]||'Continue in sequence.')+'</p></div>';items.forEach(function(x){var v=x.v,i=x.i,done=completed.has(v.videoId),open=!done&&i===active,media='';if(done||open){media='<div class="player"><iframe '+(open?'id="activePlayer" ':'')+'src="'+ytSrc(v.videoId)+'" title="'+esc(v.title)+'" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>'}else{media='<div class="locked-player"><div class="lock">🔒</div><b>Video locked</b><small>Complete the previous video fully, without skipping, to unlock this one.</small></div>'}html+='<article class="video-card">'+media+'<div class="body"><b>'+esc(v.title)+'</b>'+(v.description?'<div class="what"><strong>ಈ videoನಲ್ಲಿ ಏನು ಇದೆ?</strong><br>'+esc(v.description)+'</div>':'')+'<small>'+esc(v.source||teacher)+'</small><span class="state '+(done?'done':open?'active':'locked')+'">'+(done?'✓ Completed':open?'● Watch fully to unlock next':'🔒 Locked')+'</span></div></article>'});html+='</section>'});listEl.innerHTML=html;if(active>=0)startTracker();
}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&currentIndex()>=0)startTracker()});render();
})();
</script>
</body>
</html>
