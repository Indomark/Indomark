<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="theme-color" content="#050914">
  <meta name="description" content="Indomark login">
  <title>Indomark — Login</title>
  <link rel="stylesheet" href="../css/login.css?v=6">
</head>
<body class="entry-login">
  <main class="login-page">
    <section class="login-shell" aria-label="Login to Indomark">
      <header class="login-header">
        <div class="login-brand" aria-label="Indomark">
          <span class="brand-bolt" aria-hidden="true"></span>
          <span class="brand-wordmark"><span class="brand-indo">Indo</span><span class="brand-speed">mark</span></span>
        </div>
        <h1>Welcome Back</h1>
        <p class="subtitle">Login to continue your smart investing journey</p>
      </header>
      <form id="loginForm" class="login-form" novalidate>
        <label for="email">Email<input id="email" name="email" type="email" autocomplete="email" placeholder="rahul@gmail.com" required></label>
        <label for="password">Password<span class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required><button type="button" id="togglePassword" class="icon-button" aria-label="Show password" aria-pressed="false">◉</button></span></label>
        <button class="primary-button" type="submit">Login</button>
      </form>
      <p class="signup-copy">Don't have an account? <a href="./signup.html" id="signupLink">Sign Up</a></p>
      <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="../js/firebase-config.js?v=3"></script>
  <script src="../js/login.js?v=5"></script>
</body>
</html>
