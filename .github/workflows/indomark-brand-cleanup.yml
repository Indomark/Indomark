name: Indomark brand cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Replace legacy brand namespace
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git grep -Il -e 'IndoSpeed' -e 'indospeed' -e 'INDOSPEED' || true)
          for f in "${files[@]}"; do
            perl -0pi -e 's/IndoSpeed/Indomark/g; s/indospeed/indomark/g; s/INDOSPEED/INDOMARK/g' "$f"
          done
          rm -f .github/workflows/indomark-brand-cleanup.yml
      - name: Commit cleaned source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No legacy brand references found.'
            exit 0
          fi
          git commit -m 'Permanently remove legacy IndoSpeed branding'
          git push
